<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pixel VFX</title>
<!-- 개발용: 게임의 픽셀 투사체·임팩트 모듈(js/battle/pixelfx.js)을 그대로 불러 직업별로 확인 -->
<style>
:root{--bg:#0e1018;--card:#171b27;--line:#2a3042;--tx:#e2e8f0;--sub:#94a3b8;--acc:#f59e0b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 'Noto Sans KR',system-ui,sans-serif;padding:20px 16px}
h1{font-size:18px;margin:0 0 4px}.lead{color:var(--sub);margin:0 0 12px;font-size:13px;max-width:900px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;align-items:center}
.row b{font-weight:500;color:var(--sub);font-size:12px;margin-right:2px}
button{background:transparent;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;font:inherit;font-size:13px}
button:hover,button.on{border-color:var(--acc);color:var(--acc)}
.frame{width:100%;max-width:960px;aspect-ratio:16/9;border-radius:12px;overflow:hidden;border:1px solid var(--line);position:relative}
#world{position:absolute;left:0;top:0;width:640px;height:360px;transform-origin:0 0}
#world canvas{position:absolute;left:0;top:0}
.note{color:var(--sub);font-size:12px;margin-top:8px;max-width:960px}
</style>
</head>
<body>
<h1>픽셀 투사체·임팩트 — 원거리 직업</h1>
<p class="lead">게임에서 쓰는 js/battle/pixelfx.js를 그대로 불러 그립니다. 화면은 실제 전투 크기(칸 폭 64px)의 1.5배, "확대"를 누르면 3배입니다.</p>
<div class="row" id="kinds"><b>직업</b></div>
<div class="row">
  <button id="auto" class="on">자동 반복</button>
  <b style="margin-left:10px">거리</b><button data-d="2">2칸</button><button data-d="3" class="on">3칸</button><button data-d="5">5칸</button>
  <b style="margin-left:10px">보기</b><button id="slow">느리게(×4)</button><button id="zoom">확대</button>
</div>
<div class="frame" id="frame"><div id="world"><canvas id="bg" width="640" height="360"></canvas><canvas id="vfx-canvas" width="640" height="360"></canvas></div></div>
<p class="note" id="desc"></p>
<script src="../js/battle/pixelfx.js"></script>
<script>
const KINDS = [
  ['archer', '🏹 궁수', 'archer_01', '포물선 화살 + 바람 꼬리 → 섬광·방사 불꽃·나무 파편'],
  ['mage', '🔮 마법사', 'mage_01', '마탄 + 푸른 잔광 → 원형 충격파·파편'],
  ['commander', '🎼 지휘관', 'commander_02', '물결치는 음표 + 금빛 반짝임 → 금빛 파동·작은 음표 셋'],
  ['priest', '✝️ 사제', 'priest_02', '성광 구슬 + 떠오르는 빛 입자 → 십자 섬광·마름모 빛·떠오르는 빛'],
  ['summoner', '📖 소환사', 'summoner_01', '회전하는 마름모 룬(물결 궤적) + 보랏빛 입자 → 마름모 파동'],
  ['shaman', '🎭 주술사', 'shaman_01', '일렁이는 꼬리의 영혼 불꽃(낮은 포물선) → 독액 방울·보랏빛 연기'],
];
const TILE = 64, GROUND = 256, AX = 80;
let dist = 3, cur = 0, auto = true, zoom = false, slow = 1;
const IMG = {}; [...KINDS.map(k => k[2]), 'warrior_02'].forEach(k => { IMG[k] = new Image(); IMG[k].src = '../image/character/' + k + '.png'; });
const bg = document.getElementById('bg').getContext('2d'), world = document.getElementById('world'), frame = document.getElementById('frame');
let shake = 0;
function fit() {
  const s = frame.clientWidth / 640 * (zoom ? 2 : 1);
  world.style.transform = `scale(${s})` + (zoom ? ` translate(${-(AX + dist * TILE / 2 - 160)}px, -150px)` : '');
}
addEventListener('resize', fit);
function drawScene() {
  bg.fillStyle = '#1a2230'; bg.fillRect(0, 0, 640, 360);
  for (let i = 0; i < 10; i++) {
    bg.fillStyle = i % 2 ? '#3f5a35' : '#46633b'; bg.fillRect(AX - 32 + i * TILE, GROUND, TILE, 40);
    bg.fillStyle = '#2f4529'; bg.fillRect(AX - 32 + i * TILE, GROUND + 40, TILE, 80);
  }
  const ch = (k, x, flip, dx = 0) => {
    const im = IMG[k]; if (!im.complete || !im.naturalWidth) return;
    const h = 60, w = im.naturalWidth / im.naturalHeight * h;
    bg.save(); bg.translate(x + dx, GROUND + 6); if (flip) bg.scale(-1, 1); bg.drawImage(im, -w / 2, -h, w, h); bg.restore();
  };
  ch(KINDS[cur][2], AX, false);
  ch('warrior_02', AX + dist * TILE, true, shake > 0 ? (shake % 4 < 2 ? 3 : -3) : 0);
  if (shake > 0) shake--;
  requestAnimationFrame(drawScene);
}
// 게임과 같은 계산: 몸통 중심에서 대상 쪽으로 18px 앞·직업별 높이 보정에서 발사, 대상 몸통 앞 8px에 명중
let timer = 0;
function fire() {
  const kind = KINDS[cur][0], fl = PixelFX.FLIGHT[kind];   // 비행 시간은 틱 기준이라 timeScale로 함께 느려짐
  const ay = GROUND - 30, ax = AX, tx = AX + dist * TILE, ty = GROUND - 30;
  PixelFX.shoot(kind, ax + 18, ay - PixelFX.up(kind), tx - 8, ty, fl);
  setTimeout(() => { PixelFX.impact(kind, tx - 8, ty); shake = 12; }, fl * slow);
  document.getElementById('desc').textContent = KINDS[cur][1] + ': ' + KINDS[cur][3];
}
function loop() { fire(); clearTimeout(timer); timer = setTimeout(() => { if (auto) { cur = (cur + 1) % KINDS.length; mark(); } loop(); }, 1500 * slow); }
const kindsEl = document.getElementById('kinds');
KINDS.forEach(([k, name], i) => { const b = document.createElement('button'); b.textContent = name; b.onclick = () => { cur = i; mark(); clearTimeout(timer); loop(); }; kindsEl.appendChild(b); });
function mark() { kindsEl.querySelectorAll('button').forEach((b, i) => b.classList.toggle('on', i === cur)); }
document.getElementById('auto').onclick = e => { auto = !auto; e.target.classList.toggle('on', auto); };
document.querySelectorAll('[data-d]').forEach(b => b.onclick = () => { dist = +b.dataset.d; document.querySelectorAll('[data-d]').forEach(o => o.classList.toggle('on', o === b)); fit(); });
document.getElementById('slow').onclick = e => { slow = slow === 1 ? 4 : 1; PixelFX.timeScale = 1 / slow; e.target.classList.toggle('on', slow === 4); };
document.getElementById('zoom').onclick = e => { zoom = !zoom; e.target.classList.toggle('on', zoom); fit(); };
window.__pick = i => { cur = i; mark(); clearTimeout(timer); loop(); };
fit(); mark(); drawScene(); loop();
</script>
</body>
</html>
