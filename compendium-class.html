<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>📖 직업 도감</title>
<link rel="stylesheet" href="css/compendium-common.css">
<script src="data/jab.js"></script>
<script src="js/skills.js"></script>
<script defer src="js/common/i18n.js"></script>
<script defer src="js/common/nav.js"></script>
<style>

/* Header */
.header{text-align:center;padding:32px 16px 0;position:relative}
.header h1{font-size:28px;font-weight:900;color:var(--gold);letter-spacing:2px;
  text-shadow:0 0 40px rgba(240,192,64,.25)}
.header .sub{color:var(--dim);font-size:13px;margin-top:4px}

/* Tabs */
.tabs{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;padding:20px 16px 0;position:sticky;top:0;
  z-index:10;background:linear-gradient(var(--bg) 60%,transparent)}
.tab-btn{padding:8px 16px;border:1px solid var(--border);border-radius:8px;background:var(--card);
  color:var(--dim);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;
  transition:all .2s}
.tab-btn:hover{border-color:var(--gold);color:var(--text)}
.tab-btn.active{background:var(--gold);color:var(--bg);border-color:var(--gold);
  box-shadow:0 0 20px rgba(240,192,64,.3)}

/* Content */
.content{max-width:900px;margin:0 auto;padding:20px 16px 60px}
.panel{display:none;animation:fadeIn .3s}
.panel.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* Section Header */
.sec-head{font-size:11px;color:var(--dim);letter-spacing:2px;text-transform:uppercase;
  padding-bottom:8px;margin-bottom:16px;border-bottom:1px solid var(--border)}

/* Card Grid */
.card-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-bottom:20px}

/* Class Card */
.class-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;
  display:flex;flex-direction:column;gap:12px;transition:all .2s;cursor:pointer}
.class-card:hover{border-color:rgba(240,192,64,.2);box-shadow:0 0 20px rgba(240,192,64,.08)}

.class-card-header{display:flex;gap:12px;align-items:flex-start}
.class-icon{font-size:48px;line-height:1;flex-shrink:0}
.class-meta{flex:1;min-width:0}
.class-name{font-size:18px;font-weight:900;color:var(--gold);margin:0}
.class-desc{font-size:12px;color:var(--dim);margin-top:4px}

.role-tag{display:inline-block;font-size:10px;padding:2px 6px;border-radius:4px;font-weight:700;margin-top:4px}

/* Stat Box */
.stat-box{background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:8px;padding:8px;
  display:grid;grid-template-columns:repeat(5,1fr);gap:4px;font-size:12px}

.stat-item{text-align:center}
.stat-label{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.stat-value{font-weight:900;color:var(--gold);font-size:16px}

/* Resource Info */
.res-info{background:rgba(0,0,0,.3);border:1px solid var(--border);border-radius:6px;padding:8px;
  display:flex;justify-content:space-between;align-items:center;font-size:11px}

/* Growth Info */
.growth-info{border-top:1px solid var(--border);padding-top:8px}
.growth-row{display:flex;align-items:center;gap:8px;margin-bottom:4px;font-size:11px}

/* Resource System */
.res-block{border-left:3px solid;padding:12px 16px;background:var(--card);border-radius:0 12px 12px 0;margin-bottom:12px}
.res-meter{display:flex;align-items:center;gap:8px;margin:8px 0}
.res-meter-label{width:80px;font-size:12px;font-weight:700;flex-shrink:0;color:var(--text)}
.res-meter-track{flex:1;background:rgba(255,255,255,.04);border-radius:4px;height:16px;overflow:hidden}
.res-meter-fill{height:100%;border-radius:4px;font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:700}
.res-meter-info{font-size:11px;color:var(--dim);width:120px;text-align:right;flex-shrink:0}

/* Responsive */
@media(max-width:768px){
  .header h1{font-size:22px}
  .content{padding:20px 12px 60px}
  .card-grid{grid-template-columns:1fr}
}
</style>
</head>
<body data-page="compendium-class">

<header id="top-nav">
  <button id="nav-back" onclick="history.back()"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button>
  <div id="nav-title" data-i18n="compendium.title_class">직업 도감</div>
  <button id="nav-settings" onclick="location.href='settings.html'"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
</header>

<div class="header">
  <h1 data-i18n="compendium.title_class">${t('compendium.title_class')}</h1>
  <div class="sub" data-i18n="compendium.subtitle_class">${t('compendium.subtitle_class')}</div>
</div>

<div class="tabs" id="tabs">
  <button class="tab-btn active" data-tab="cards" data-i18n="compendium.tab_card_view">${t('compendium.tab_card_view')}</button>
  <button class="tab-btn" data-tab="resource" data-i18n="compendium.tab_resource_system">${t('compendium.tab_resource_system')}</button>
</div>

<div class="content">

  <!-- 카드 뷰 패널 -->
  <div class="panel active" id="p-cards">
    <div class="sec-head">CLASSES OVERVIEW</div>
    <div id="class-cards" class="card-grid"></div>
  </div>

  <!-- 자원 시스템 패널 -->
  <div class="panel" id="p-resource">
    <div class="sec-head">RESOURCE SYSTEM</div>
    <div id="res-blocks"></div>

  </div>

</div><!-- end content -->

<nav id="bottom-nav" style="position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--border);
  display:flex;gap:8px;padding:8px;justify-content:space-around;z-index:100">
  <button onclick="location.href='index.html'" style="flex:1;padding:12px;background:var(--card);border:1px solid var(--border);
    border-radius:8px;color:var(--text);font-weight:700;cursor:pointer;font-size:11px" data-i18n="compendium.nav_lobby">${t('compendium.nav_lobby')}</button>
  <button onclick="location.href='compendium-stage.html'" style="flex:1;padding:12px;background:var(--card);border:1px solid var(--border);
    border-radius:8px;color:var(--text);font-weight:700;cursor:pointer;font-size:11px" data-i18n="compendium.nav_stage">${t('compendium.nav_stage')}</button>
  <button onclick="location.href='compendium-item.html'" style="flex:1;padding:12px;background:var(--card);border:1px solid var(--border);
    border-radius:8px;color:var(--text);font-weight:700;cursor:pointer;font-size:11px" data-i18n="compendium.nav_item">${t('compendium.nav_item')}</button>
</nav>

<script>
const PLAYER_CLASSES = ['warrior','knight','assassin','mage','archer','priest','novice','summoner','shaman','brawler','lancer','sapper'];

function getRole(cls) {
  if (cls === 'priest') return 'healer';
  return (JAB[cls]?.base.range || 1) > 1 ? 'ranged' : 'melee';
}

function roleStyle(role) {
  const m = { melee:'background:rgba(248,113,113,.15);color:#f87171', ranged:'background:rgba(96,165,250,.15);color:#60a5fa', healer:'background:rgba(74,222,128,.15);color:#4ade80' };
  return m[role] || '';
}

function resColor(res) {
  return res === 'fury' ? 'var(--fury)' : res === 'energy' ? 'var(--energy)' : res === 'mana' ? 'var(--mana)' : 'var(--dim)';
}

// 클래스 카드 렌더링
function renderClassCards() {
  const container = document.getElementById('class-cards');
  container.innerHTML = '';

  PLAYER_CLASSES.forEach(cls => {
    const d = JAB[cls]; if (!d) return;
    const b = d.base;
    const role = getRole(cls);
    const skills = typeof getSkills === 'function' ? getSkills(cls) : [];
    const passive = typeof FURY_PASSIVES !== 'undefined' ? FURY_PASSIVES[cls] : null;

    // 스킬 HTML
    let skillHtml = '';
    if (skills.length) {
      skillHtml = skills.map(sk =>
        `<div style="display:flex;gap:6px;align-items:center;font-size:11px;padding:4px 0">
          <span>${sk.icon}</span>
          <span style="color:var(--gold);font-weight:700">${t('skills.'+sk.id) || sk.name}</span>
          <span style="color:var(--dim);flex:1">${t('skills_desc.'+sk.id) || sk.desc}</span>
          <span style="color:${resColor(sk.costType)};font-weight:700;font-size:10px">${sk.cost} ${t('resources.'+sk.costType) || sk.costType}</span>
        </div>`
      ).join('');
    }

    // 패시브 HTML
    let passiveHtml = '';
    if (passive) {
      const pKey = cls === 'warrior' ? 'fury_buff' : 'iron_will';
      passiveHtml = `
        <div style="display:flex;gap:6px;align-items:center;font-size:11px;padding:4px 0;border-top:1px solid var(--border)">
          <span>${passive.icon}</span>
          <span style="color:var(--purple);font-weight:700">${t('passives.'+pKey) || passive.name}</span>
          <span style="color:var(--dim);font-size:10px">패시브</span>
          <span style="color:var(--dim);flex:1">${t('passives_desc.'+pKey) || passive.desc}</span>
        </div>`;
    }
    // 암살자 은신 패시브
    if (cls === 'assassin') {
      passiveHtml = `
        <div style="display:flex;gap:6px;align-items:center;font-size:11px;padding:4px 0;border-top:1px solid var(--border)">
          <span>🌿</span>
          <span style="color:var(--purple);font-weight:700">은신</span>
          <span style="color:var(--dim);font-size:10px">패시브</span>
          <span style="color:var(--dim);flex:1">숲 지형에서 적에게 보이지 않음</span>
        </div>`;
    }

    const card = document.createElement('div');
    card.className = 'class-card';
    card.innerHTML = `
      <div class="class-card-header">
        <div class="class-icon">${d.icon}</div>
        <div class="class-meta">
          <div class="class-name">${t('classes.'+cls) || cls}</div>
          <div class="class-desc">${t('class_desc.'+cls) || ''}</div>
          <span class="role-tag" style="${roleStyle(role)}">${t('roles.'+role) || role}</span>
        </div>
      </div>

      <div class="stat-box">
        <div class="stat-item"><div class="stat-label">HP</div><div class="stat-value">${b.hp}</div></div>
        <div class="stat-item"><div class="stat-label">ATK</div><div class="stat-value">${b.atk}</div></div>
        <div class="stat-item"><div class="stat-label">DEF</div><div class="stat-value">${b.def}</div></div>
        <div class="stat-item"><div class="stat-label">MOV</div><div class="stat-value">${b.move}</div></div>
        <div class="stat-item"><div class="stat-label">RNG</div><div class="stat-value">${b.range}</div></div>
      </div>

      <div class="res-info">
        <span style="color:${resColor(d.res)};font-weight:700">${t('resources.'+d.res) || d.res} ${d.maxRes}</span>
        <span style="color:var(--dim)">${d.resRec > 0 ? '턴당 +'+d.resRec : d.res === 'fury' ? '전투 시 충전' : ''}</span>
      </div>

      ${(skillHtml || passiveHtml) ? `<div style="background:rgba(0,0,0,.2);border:1px solid var(--border);border-radius:6px;padding:8px">${skillHtml}${passiveHtml}</div>` : ''}

      <div class="growth-info">
        <div class="growth-row">
          <span style="color:var(--dim);width:32px">HP</span>
          <div style="flex:1;height:6px;background:rgba(255,255,255,.04);border-radius:3px;overflow:hidden">
            <div style="width:${(d.growth.hp[1]/18*100).toFixed(0)}%;height:100%;background:var(--green);border-radius:3px"></div>
          </div>
          <span style="color:var(--dim);width:48px;text-align:right">+${d.growth.hp[0]}~${d.growth.hp[1]}</span>
        </div>
        <div class="growth-row">
          <span style="color:var(--dim);width:32px">ATK</span>
          <div style="flex:1;height:6px;background:rgba(255,255,255,.04);border-radius:3px;overflow:hidden">
            <div style="width:${(d.growth.atk[1]/5*100).toFixed(0)}%;height:100%;background:var(--red);border-radius:3px"></div>
          </div>
          <span style="color:var(--dim);width:48px;text-align:right">+${d.growth.atk[0]}~${d.growth.atk[1]}</span>
        </div>
        <div class="growth-row">
          <span style="color:var(--dim);width:32px">DEF</span>
          <div style="flex:1;height:6px;background:rgba(255,255,255,.04);border-radius:3px;overflow:hidden">
            <div style="width:${(d.growth.def[1]/4*100).toFixed(0)}%;height:100%;background:var(--blue);border-radius:3px"></div>
          </div>
          <span style="color:var(--dim);width:48px;text-align:right">+${d.growth.def[0]}~${d.growth.def[1]}</span>
        </div>
      </div>
    `;
    container.appendChild(card);
  });
}

// 자원 시스템 렌더링
function renderResBlocks() {
  const container = document.getElementById('res-blocks');
  container.innerHTML = '';

  const groups = [
    { res:'fury', color:'var(--fury)', label:'분노 (Fury)', desc:'공격 시 +1, 피격 시 +2 충전. MAX 도달 시 패시브 자동 발동 후 0으로 리셋.',
      classes: PLAYER_CLASSES.filter(c => JAB[c]?.res === 'fury') },
    { res:'energy', color:'var(--energy)', label:'에너지 (Energy)', desc:'매 턴 자동 회복. 액티브 스킬 사용 시 소모.',
      classes: PLAYER_CLASSES.filter(c => JAB[c]?.res === 'energy') },
    { res:'mana', color:'var(--mana)', label:'마나 (Mana)', desc:'매 턴 자동 회복. 마법/힐 스킬 사용 시 소모. 전투 시작 시 MAX.',
      classes: PLAYER_CLASSES.filter(c => JAB[c]?.res === 'mana') }
  ];

  groups.forEach(g => {
    const block = document.createElement('div');
    block.className = 'res-block';
    block.style.borderColor = g.color;

    let metersHtml = g.classes.map(cls => {
      const d = JAB[cls];
      const pct = 100;
      return `<div class="res-meter">
        <div class="res-meter-label">${d.icon} ${t('classes.'+cls) || cls}</div>
        <div class="res-meter-track">
          <div class="res-meter-fill" style="width:${pct}%;background:${g.color};color:var(--bg)">${d.maxRes}</div>
        </div>
        <div class="res-meter-info">${d.resRec > 0 ? '턴당 +'+d.resRec : 'MAX '+d.maxRes}</div>
      </div>`;
    }).join('');

    block.innerHTML = `
      <div style="font-weight:900;font-size:15px;margin-bottom:4px;color:${g.color}">${g.label}</div>
      <div style="font-size:12px;color:var(--dim);margin-bottom:8px">${g.desc}</div>
      ${metersHtml}
    `;
    container.appendChild(block);
  });
}

// 탭 전환
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('p-' + btn.dataset.tab).classList.add('active');
  };
});

// 초기화
document.addEventListener('DOMContentLoaded', async () => {
  if (typeof loadI18n === 'function') await loadI18n();
  renderClassCards();
  renderResBlocks();
});
</script>
</body>
</html>
