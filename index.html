<!DOCTYPE html>
<html lang="ko">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
	<title>DEADLINE 15</title>
	<link rel="stylesheet" href="css/common.css">
	<link rel="stylesheet" href="css/lobby.css">
	<script type="text/javascript" src="js/common/i18n.js"></script>
	<script type="text/javascript" src="js/common/modal.js"></script>
	<script type="text/javascript" src="data/jab.js"></script>
	<script defer src="js/common/nav.js"></script>
	<script type="text/javascript" src="js/index.js"></script>
</head>

<body data-page="lobby" onload="init();">
	<div id="splash">
		<div class="splash-title" data-i18n="common.game_title">DEADLINE 15</div>
		<div class="splash-loading" data-i18n="common.loading">loading...</div>
	</div>
	<header id="top-nav">
		<button id="nav-back" class="hidden"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button>
		<div id="nav-title" data-i18n="common.game_title">DEADLINE 15</div>
		<button id="nav-settings" onclick="location.href='settings.html'"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
	</header>
	<main id="content">
		<div class="lobby-bg"></div>
		<div class="lobby-content">
			<div class="gold-badge lobby-gold">
				<img src="image/icon/64x64/fc131.png" alt="Gold">
				<span id="lobby-gold">0</span> G
			</div>
			<div class="clan-hideout" id="clan-hideout"></div>
			<!-- 로비 팝업 버튼들 -->
			<div class="lobby-popups">
				<button class="popup-btn compendium-btn" onclick="location.href='compendium.html'" title="도감 보기">
					<span class="popup-icon">📖</span>
					<span class="popup-label">도감</span>
				</button>
				<button class="popup-btn guide-btn" onclick="location.href='guide.html'" title="초보자 가이드">
					<span class="popup-icon">📚</span>
					<span class="popup-label">가이드</span>
				</button>
			</div>
		</div>
	</main>
	<nav id="bottom-nav"></nav>
	<div id="modal-overlay">
		<div id="modal-box">
			<div id="modal-title"></div>
			<div id="modal-sub"></div>
			<div id="modal-buttons"></div>
		</div>
	</div>
</body>

</html>
