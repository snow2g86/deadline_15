<!DOCTYPE html>
<html lang="ko">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
	<title>DEADLINE 15</title>
	<link rel="stylesheet" href="css/common.css">
	<link rel="stylesheet" href="css/party-select.css">
	<link rel="stylesheet" href="css/equip.css">
	<script type="text/javascript" src="js/common/i18n.js"></script>
	<script type="text/javascript" src="js/common/modal.js"></script>
	<script type="text/javascript" src="data/jab.js"></script>
	<!-- 공통 모듈 (의존성 순서) -->
	<script type="text/javascript" src="js/common/constants.js"></script>
	<script type="text/javascript" src="js/common/storage.js"></script>
	<script type="text/javascript" src="js/common/character.js"></script>
	<script type="text/javascript" src="js/common/render.js"></script>
	<script type="text/javascript" src="data/equip.js"></script>
	<script type="text/javascript" src="js/sprites.js"></script>
	<script defer src="js/common/nav.js"></script>
	<script type="text/javascript" src="js/party-select.js"></script>
</head>

<body data-page="party-select" onload="init();">
	<div id="splash">
		<div class="splash-title" data-i18n="common.game_title">DEADLINE 15</div>
		<div class="splash-loading" data-i18n="common.loading">loading...</div>
	</div>
	<header id="top-nav">
		<button id="nav-back" onclick="partyBack()"><svg viewBox="0 0 24 24">
				<polyline points="15 18 9 12 15 6" />
			</svg></button>
		<div id="nav-title" data-i18n="party.title">DEADLINE 15</div>
		<button id="nav-settings" onclick="location.href='settings.html'"><svg viewBox="0 0 24 24">
				<circle cx="12" cy="12" r="3" />
				<path
					d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
			</svg></button>
	</header>
	<main id="content">
		<!-- Gold HUD -->
		<div class="page-hud">
			<div class="gold-badge"><img src="image/icon/64x64/fc131.png" alt="Gold"><span
					id="ps-gold-val">0</span> G</div>
		</div>
		<!-- Tabs (matching shop/sanctuary/academy pattern) -->
		<div class="game-tab-wrap">
			<div class="game-tabs" id="page-tabs">
				<button class="game-tab active" data-ptab="party" data-i18n="nav.party">파티</button>
				<button class="game-tab" data-ptab="equip" data-i18n="nav.equip">장비</button>
				<button class="game-tab" data-ptab="item" data-i18n="party.tab_item">아이템</button>
				<button class="game-tab" data-ptab="enhance" data-i18n="nav.enhance">강화</button>
			</div>
		</div>

		<!-- Party section -->
		<div id="section-party">
			<div class="ps-layout">
				<div class="ps-left">
					<div class="ps-counter" id="ps-counter">0 / 5</div>
					<div class="ps-party" id="ps-party"></div>
				</div>
				<div class="ps-right">
					<div class="ps-tabs" id="ps-tabs"></div>
					<div class="ps-roster" id="ps-roster"></div>
				</div>
			</div>
			<button class="ps-start" id="ps-start" disabled onclick="confirmP()" data-i18n="party.start_battle">DEADLINE
				15</button>
		</div>

		<!-- Item section -->
		<div id="section-item" style="display:none">
			<div class="item-list" id="item-list"></div>
		</div>

		<!-- Equip section -->
		<div id="section-equip" style="display:none">
			<div class="eq-chars" id="eq-chars"></div>
		</div>

		<!-- Enhance section -->
		<div id="section-enhance" style="display:none">
			<div class="enhance-list" id="enhance-list"></div>
		</div>
	</main>
	<nav id="bottom-nav"></nav>
	<div id="modal-overlay">
		<div id="modal-box">
			<div id="modal-title"></div>
			<div id="modal-sub"></div>
			<div id="modal-buttons"></div>
		</div>
	</div>
</body>

</html>
