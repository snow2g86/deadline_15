<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>DEADLINE 15</title>
<link rel="stylesheet" href="css/style.css">
<script defer src="js/data.js"></script>
<script defer src="js/classes.js"></script>
<script defer src="js/roster.js"></script>
<script defer src="js/skills.js"></script>
<script defer src="js/core.js"></script>
<script defer src="js/combat.js"></script>
<script defer src="js/vfx.js"></script>
<script defer src="js/audio.js"></script>
<script defer src="js/ai.js"></script>
<script defer src="js/render.js"></script>
<script defer src="js/ui.js"></script>
<script defer src="js/lobby.js"></script>
<script defer src="js/i18n-data.js"></script>
<script defer src="js/i18n.js"></script>
<script defer src="js/boot.js"></script>
</head>
<body data-page="shop">
<header id="top-nav">
  <button id="nav-back" onclick="location.href='index.html'">←</button>
  <div id="nav-title" data-i18n="shop.title">${t('shop.title')}</div>
  <button id="nav-settings" onclick="location.href='settings.html'">⚙</button>
</header>
<main id="content">
  <div class="shop-hud">
    <div class="shop-hud-gold"><img src="image/icon/64x64/fc131.png" alt="Gold" style="width:18px;height:auto;vertical-align:middle;margin-right:3px"><span id="shop-gold-val">0</span> G</div>
  </div>
  <div class="shop-tabs-wrapper">
    <div class="shop-tabs">
      <button class="shop-tab-btn active" data-tab="mercenary" onclick="G.switchTab('mercenary')" data-i18n="shop.tab_mercenary">${t('shop.tab_mercenary')}</button>
      <button class="shop-tab-btn" data-tab="item" onclick="G.switchTab('item')" data-i18n="shop.tab_item">${t('shop.tab_item')}</button>
      <button class="shop-tab-btn" data-tab="job" onclick="G.switchTab('job')" data-i18n="shop.tab_job">${t('shop.tab_job')}</button>
      <button class="shop-tab-btn" data-tab="gold" onclick="G.switchTab('gold')" data-i18n="shop.tab_gold">${t('shop.tab_gold')}</button>
    </div>
  </div>
  <div class="shop-info-row">
    <div class="shop-info-title" id="shop-info-title" data-i18n="shop.subtitle_mercenary">${t('shop.subtitle_mercenary')}</div>
    <div class="shop-info-timer" id="shop-timer"><span data-i18n="shop.refresh_timer">${t('shop.refresh_timer')}</span> --</div>
  </div>
  <div id="shop-list" class="card-list"></div>
</main>
<nav id="bottom-nav">
  <button class="bnav-tab" data-tab="stage" onclick="G.openStage()">
    <span class="bnav-icon">⚔</span><span class="bnav-label" data-i18n="nav.stage">스테이지</span>
  </button>
  <button class="bnav-tab" data-tab="party" onclick="G.openParty()">
    <span class="bnav-icon">👥</span><span class="bnav-label" data-i18n="nav.party">파티</span>
  </button>
  <button class="bnav-tab" data-tab="sanctuary" onclick="location.href='sanctuary.html'">
    <span class="bnav-icon">⛪</span><span class="bnav-label" data-i18n="nav.sanctuary">성소</span>
  </button>
  <button class="bnav-tab active" data-tab="shop" onclick="location.href='shop.html'">
    <span class="bnav-icon">🏪</span><span class="bnav-label" data-i18n="nav.shop">상점</span>
  </button>
</nav>
<div id="modal-overlay"><div id="modal-box"><div id="modal-title"></div><div id="modal-sub"></div><div id="modal-buttons"></div></div></div>
</body>
</html>
