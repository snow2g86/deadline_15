<!DOCTYPE html>
<html lang="ko">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
	<title>DEADLINE 15</title>
	<link rel="stylesheet" href="css/common.css">
	<link rel="stylesheet" href="css/shop.css">
	<script type="text/javascript" src="js/common/i18n.js"></script>
	<script type="text/javascript" src="js/common/modal.js"></script>
	<script type="text/javascript" src="data/jab.js"></script>
	<script type="text/javascript" src="data/equip.js"></script>
	<script type="text/javascript" src="js/skills.js"></script>
	<script type="text/javascript" src="js/sprites.js"></script>
	<script defer src="js/common/nav.js"></script>
	<script type="text/javascript" src="js/shop.js"></script>
</head>

<body data-page="shop" onload="init();">
	<div id="splash">
		<div class="splash-title" data-i18n="common.game_title">DEADLINE 15</div>
		<div class="splash-loading" data-i18n="common.loading">loading...</div>
	</div>
	<header id="top-nav">
		<button id="nav-back" onclick="location.href='index.html'"><svg viewBox="0 0 24 24">
				<polyline points="15 18 9 12 15 6" />
			</svg></button>
		<div id="nav-title" data-i18n="shop.title">DEADLINE 15</div>
		<button id="nav-settings" onclick="location.href='settings.html'"><svg viewBox="0 0 24 24">
				<circle cx="12" cy="12" r="3" />
				<path
					d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
			</svg></button>
	</header>
	<main id="content">
		<div class="shop-hud">
			<div class="gold-badge shop-hud-gold"><img src="image/icon/64x64/fc67.png" alt="Gold"><span
					id="shop-gold-val">0</span> G</div>
		</div>
		<div class="shop-tabs-wrapper">
			<div class="shop-tabs">
				<button class="shop-tab-btn active" data-tab="mercenary" onclick="switchTab('mercenary')"
					data-i18n="shop.tab_mercenary"></button>
				<button class="shop-tab-btn" data-tab="consumable" onclick="switchTab('consumable')"
					data-i18n="shop.tab_consumable"></button>
				<button class="shop-tab-btn" data-tab="equip" onclick="switchTab('equip')"
					data-i18n="shop.tab_equip"></button>
				<button class="shop-tab-btn" data-tab="skill" onclick="switchTab('skill')"
					data-i18n="shop.tab_skill"></button>
				<button class="shop-tab-btn" data-tab="scroll" onclick="switchTab('scroll')"
					data-i18n="shop.tab_scroll"></button>
				<button class="shop-tab-btn" data-tab="gold" onclick="switchTab('gold')"
					data-i18n="shop.tab_gold"></button>
			</div>
		</div>
		<div class="shop-info-row">
			<div class="shop-info-title" id="shop-info-title" data-i18n="shop.subtitle_mercenary">DEADLINE 15</div>
			<div class="shop-info-timer" id="shop-timer"><span data-i18n="shop.refresh_timer">DEADLINE 15</span></div>
		</div>
		<div id="shop-list" class="card-list"></div>
	</main>
	<nav id="bottom-nav"></nav>
	<div id="modal-overlay">
		<div id="modal-box">
			<div id="modal-title"></div>
			<div id="modal-sub"></div>
			<div id="modal-buttons"></div>
		</div>
	</div>
</body>

</html>
