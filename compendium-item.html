<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🧪 아이템 도감</title>
<link rel="stylesheet" href="css/common.css">
<script src="data/jab.js"></script>
<script>
var EXP_POTIONS = [
  { id: 'exp_s', name: '소형 경험치 물약', icon: '🧪', exp: 50, cost: 400, weight: 50 },
  { id: 'exp_m', name: '중형 경험치 물약', icon: '⚗️', exp: 150, cost: 1000, weight: 35 },
  { id: 'exp_l', name: '대형 경험치 물약', icon: '🏺', exp: 400, cost: 2400, weight: 15 }
];
</script>
<script defer src="js/common/i18n.js"></script>
<script defer src="js/common/nav.js"></script>
<style>

/* Header */
.header{text-align:center;padding:32px 16px 0;position:relative}
.header h1{font-size:28px;font-weight:900;color:var(--gold);letter-spacing:2px;
  text-shadow:0 0 40px rgba(240,192,64,.25)}
.header .sub{color:var(--dim);font-size:13px;margin-top:4px}

/* Tabs */
.tabs{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;padding:20px 16px 0;
  background:linear-gradient(var(--bg) 60%,transparent)}
.tab-btn{padding:8px 16px;border:1px solid var(--border);border-radius:8px;background:var(--card);
  color:var(--dim);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;
  transition:all .2s}
.tab-btn:hover{border-color:var(--gold);color:var(--text)}
.tab-btn.active{background:var(--gold);color:var(--bg);border-color:var(--gold);
  box-shadow:0 0 20px rgba(240,192,64,.3)}

/* Content */
.content{max-width:900px;margin:0 auto;padding:20px 16px 20px}
.panel{display:none;animation:fadeIn .3s}
.panel.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* Section Header */
.sec-head{font-size:11px;color:var(--dim);letter-spacing:2px;text-transform:uppercase;
  padding-bottom:8px;margin-bottom:16px;border-bottom:1px solid var(--border)}

/* Table */
table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:20px}
thead th{color:var(--dim);font-size:10px;font-weight:700;padding:8px 4px;text-align:center;
  border-bottom:2px solid var(--border);background:var(--bg);letter-spacing:.5px}
tbody td{padding:8px 4px;text-align:center;border-bottom:1px solid rgba(255,255,255,.04)}
tbody tr:hover{background:rgba(240,192,64,.04)}
th:first-child,td:first-child{text-align:center;width:50px}
th:nth-child(2),td:nth-child(2){text-align:left}

/* Item Card */
.item-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;
  margin-bottom:12px;transition:all .2s}
.item-card:hover{border-color:rgba(240,192,64,.2);box-shadow:0 0 20px rgba(240,192,64,.08)}

.item-header{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.item-icon{font-size:48px;line-height:1;flex-shrink:0}
.item-meta{flex:1}
.item-name{font-size:16px;font-weight:900;color:var(--gold)}
.item-info{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px;
  background:rgba(0,0,0,.2);padding:12px;border-radius:8px}
.info-box{text-align:center}
.info-label{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
.info-value{font-weight:900;color:var(--gold);font-size:16px;margin-top:4px}

/* Scroll Card */
.scroll-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;
  display:flex;flex-direction:column;gap:10px;transition:all .2s}
.scroll-card:hover{border-color:rgba(167,139,250,.3);box-shadow:0 0 20px rgba(167,139,250,.08)}

/* Responsive */
@media(max-width:768px){
  .header h1{font-size:22px}
  .content{padding:20px 12px 60px}
  table{font-size:11px}
  thead th{font-size:9px;padding:6px 2px}
  tbody td{padding:6px 2px}
  .item-info{grid-template-columns:1fr}
}
</style>
</head>
<body data-page="compendium-item">

<header id="top-nav">
  <button id="nav-back" onclick="history.back()"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button>
  <div id="nav-title" data-i18n="compendium.title_item">아이템 도감</div>
  <button id="nav-settings" onclick="location.href='settings.html'"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
</header>

<main>
  <div class="header">
    <h1 data-i18n="compendium.title_item"></h1>
    <div class="sub" data-i18n="compendium.subtitle_item"></div>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab-btn active" data-tab="list">🧪 경험치 물약</button>
    <button class="tab-btn" data-tab="scrolls">📜 전직서</button>
    <button class="tab-btn" data-tab="analysis">💎 효율 분석</button>
  </div>

  <div class="content">

    <!-- 경험치 물약 패널 -->
    <div class="panel active" id="p-list">
      <div class="sec-head">EXPERIENCE POTIONS</div>
      <div style="overflow-x:auto">
      <table>
        <thead>
          <tr>
            <th></th>
            <th style="text-align:left">이름</th>
            <th>EXP</th>
            <th>가격</th>
            <th>효율</th>
            <th>확률</th>
          </tr>
        </thead>
        <tbody id="item-table-body"></tbody>
      </table>
      </div>
    </div>

    <!-- 전직서 패널 -->
    <div class="panel" id="p-scrolls">
      <div class="sec-head">CLASS CHANGE SCROLLS</div>
      <div id="scroll-cards" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px"></div>
    </div>

    <!-- 효율 분석 패널 -->
    <div class="panel" id="p-analysis">
      <div class="sec-head">EFFICIENCY RANKING</div>
      <div id="efficiency-cards"></div>
    </div>

  </div><!-- end content -->
</main>

<nav id="bottom-nav" style="position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--border);
  display:flex;gap:8px;padding:8px;justify-content:space-around;z-index:100">
  <button onclick="location.href='index.html'" style="flex:1;padding:12px;background:var(--card);border:1px solid var(--border);
    border-radius:8px;color:var(--text);font-weight:700;cursor:pointer;font-size:11px" data-i18n="compendium.nav_lobby"></button>
  <button onclick="location.href='compendium-class.html'" style="flex:1;padding:12px;background:var(--card);border:1px solid var(--border);
    border-radius:8px;color:var(--text);font-weight:700;cursor:pointer;font-size:11px" data-i18n="compendium.nav_class"></button>
  <button onclick="location.href='compendium-stage.html'" style="flex:1;padding:12px;background:var(--card);border:1px solid var(--border);
    border-radius:8px;color:var(--text);font-weight:700;cursor:pointer;font-size:11px" data-i18n="compendium.nav_stage"></button>
</nav>

<script>
// 경험치 물약 테이블
function renderItemTable() {
  const potions = window.EXP_POTIONS || [];
  const totalWeight = potions.reduce((sum, p) => sum + p.weight, 0);
  const tbody = document.getElementById('item-table-body');
  tbody.innerHTML = '';

  potions.forEach(p => {
    const efficiency = (p.exp / p.cost).toFixed(2);
    const probability = ((p.weight / totalWeight) * 100).toFixed(0);
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td style="font-size:24px">${p.icon}</td>
      <td style="text-align:left;font-weight:700;color:var(--gold)">${t('items.potion_'+{s:'small',m:'medium',l:'large'}[p.id.split('_')[1]]) || p.name}</td>
      <td style="color:var(--green);font-weight:700">+${p.exp}</td>
      <td style="color:var(--blue);font-weight:700">${p.cost}G</td>
      <td style="font-weight:700;color:var(--gold)">${efficiency}</td>
      <td style="color:var(--dim)">${probability}%</td>
    `;
    tbody.appendChild(tr);
  });
}

// 전직서 카드 렌더링
function renderScrollCards() {
  const cd = window.JAB || {};
  const container = document.getElementById('scroll-cards');
  container.innerHTML = '';

  const scrolls = [
    { id:'class_change_melee', icon:'⚔️', cost:500, classes:['warrior','knight','assassin','brawler','lancer','sapper'] },
    { id:'class_change_ranged', icon:'🏹', cost:500, classes:['archer','mage','summoner','shaman'] },
    { id:'class_change_healer', icon:'✝️', cost:500, classes:['priest'] },
    { id:'class_change_universal', icon:'📜', cost:500, classes:['warrior','knight','assassin','mage','archer','priest','summoner','shaman','brawler','lancer','sapper'] }
  ];

  scrolls.forEach(sc => {
    const name = t('items.'+sc.id) || sc.id;
    const desc = t('items_desc.'+sc.id) || '';
    const classIcons = sc.classes.map(cls =>
      `<span style="display:inline-flex;align-items:center;gap:2px;background:rgba(255,255,255,.04);padding:2px 6px;border-radius:4px;font-size:10px">
        ${cd[cls]?.icon || ''} ${t('classes.'+cls) || cls}
      </span>`
    ).join(' ');

    const card = document.createElement('div');
    card.className = 'scroll-card';
    card.innerHTML = `
      <div style="display:flex;gap:12px;align-items:flex-start">
        <div style="font-size:40px;line-height:1">${sc.icon}</div>
        <div style="flex:1">
          <div style="font-size:16px;font-weight:900;color:var(--purple)">${name}</div>
          <div style="font-size:11px;color:var(--dim);margin-top:2px">${desc}</div>
          <div style="display:flex;align-items:center;gap:6px;margin-top:6px">
            <span style="color:var(--gold);font-weight:700;font-size:13px">${sc.cost}G</span>
            <span style="color:var(--dim);font-size:10px">| 노비스 전용</span>
          </div>
        </div>
      </div>
      <div style="background:rgba(0,0,0,.2);padding:8px;border-radius:6px">
        <div style="color:var(--dim);font-size:10px;margin-bottom:6px">전직 가능 직업 (${sc.classes.length})</div>
        <div style="display:flex;flex-wrap:wrap;gap:4px">${classIcons}</div>
      </div>
    `;
    container.appendChild(card);
  });
}

// 효율 분석 렌더링
function renderEfficiencyAnalysis() {
  const potions = window.EXP_POTIONS || [];
  const totalWeight = potions.reduce((sum, p) => sum + p.weight, 0);
  const container = document.getElementById('efficiency-cards');

  const sorted = [...potions]
    .map(p => ({
      ...p,
      efficiency: p.exp / p.cost,
      probability: ((p.weight / totalWeight) * 100).toFixed(0)
    }))
    .sort((a, b) => b.efficiency - a.efficiency);

  container.innerHTML = '';
  sorted.forEach((item, idx) => {
    const grades = ['S', 'A', 'B'];
    const gradeColors = ['#f87171', '#f0c040', '#60a5fa'];
    const card = document.createElement('div');
    card.className = 'item-card';
    card.innerHTML = `
      <div class="item-header">
        <div class="item-icon">${item.icon}</div>
        <div class="item-meta">
          <div class="item-name">
            ${t('items.potion_'+{s:'small',m:'medium',l:'large'}[item.id.split('_')[1]]) || item.name}
            <span style="margin-left:8px;background:${gradeColors[idx] || 'var(--dim)'};color:var(--bg);padding:2px 8px;border-radius:4px;
              font-size:11px;font-weight:700">${grades[idx] || 'C'}</span>
          </div>
          <div style="font-size:11px;color:var(--dim);margin-top:4px">#${idx + 1} 효율 순위</div>
        </div>
      </div>

      <div class="item-info">
        <div class="info-box">
          <div class="info-label">EXP</div>
          <div class="info-value" style="color:var(--green)">+${item.exp}</div>
        </div>
        <div class="info-box">
          <div class="info-label">COST</div>
          <div class="info-value" style="color:var(--blue)">${item.cost}G</div>
        </div>
        <div class="info-box">
          <div class="info-label">EXP/G</div>
          <div class="info-value" style="color:var(--gold)">${item.efficiency.toFixed(2)}</div>
        </div>
      </div>

      <div style="margin-top:12px;padding:8px;background:rgba(0,0,0,.2);border-radius:6px;font-size:11px">
        <div style="color:var(--dim);margin-bottom:2px">상점 등장 확률</div>
        <div style="display:flex;align-items:center;gap:8px">
          <div style="flex:1;height:8px;background:rgba(255,255,255,.04);border-radius:4px;overflow:hidden">
            <div style="width:${item.probability}%;height:100%;background:var(--gold);border-radius:4px"></div>
          </div>
          <span style="color:var(--text);font-weight:700">${item.probability}%</span>
        </div>
      </div>
    `;
    container.appendChild(card);
  });
}

// 탭 전환
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('p-' + btn.dataset.tab).classList.add('active');
  };
});

// 초기화
document.addEventListener('DOMContentLoaded', async () => {
  if (typeof loadI18n === 'function') await loadI18n();
  renderItemTable();
  renderScrollCards();
  renderEfficiencyAnalysis();
});
</script>
</body>
</html>
