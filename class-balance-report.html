<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEADLINE 15 - 클래스 밸런스 리포트</title>
    <link rel="stylesheet" href="css/common.css">
    <script src="data/jab.js"></script>
    <script src="js/skills.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:linear-gradient(135deg,#667eea 0%,#764ba2 100%); color:#333; line-height:1.6; }
        .container { max-width:1400px; margin:60px auto 0; background:#fff; border-radius:12px; box-shadow:0 20px 60px rgba(0,0,0,.3); overflow:hidden; height:calc(100dvh - 60px); display:flex; flex-direction:column; }
        body[data-page="class-balance-report"] #top-nav { background:linear-gradient(135deg,#667eea 0%,#764ba2 100%); border-bottom:none; padding:10px 16px; gap:20px; }
        body[data-page="class-balance-report"] #nav-title { font-size:18px; color:#fff; letter-spacing:0; font-weight:700; }
        body[data-page="class-balance-report"] #nav-back,
        body[data-page="class-balance-report"] #nav-settings { color:#fff; }
        body[data-page="class-balance-report"] #nav-back:hover,
        body[data-page="class-balance-report"] #nav-settings:hover { background:rgba(255,255,255,.1); }
        main { padding:40px; flex:1; overflow-y:auto; }
        section { margin-bottom:50px; }
        .section-title { font-size:1.8em; color:#667eea; margin-bottom:24px; padding-bottom:10px; border-bottom:3px solid #667eea; }

        /* Tabs */
        .tabs { display:flex; gap:8px; margin-bottom:24px; flex-wrap:wrap; }
        .tab { padding:8px 16px; border-radius:20px; border:2px solid #667eea; background:transparent; color:#667eea; font-weight:600; cursor:pointer; font-size:.9em; transition:all .2s; }
        .tab.active { background:#667eea; color:#fff; }
        .tab:hover:not(.active) { background:rgba(102,126,234,.1); }
        .tab-content { display:none; }
        .tab-content.active { display:block; }

        /* Class cards */
        .class-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:20px; }
        .class-card { border:2px solid #e0e0e0; border-radius:10px; padding:20px; background:#f9f9f9; transition:all .3s; }
        .class-card:hover { border-color:#667eea; box-shadow:0 5px 20px rgba(102,126,234,.2); transform:translateY(-4px); }
        .class-header { display:flex; align-items:center; gap:15px; margin-bottom:15px; }
        .class-icon { font-size:2.5em; min-width:50px; text-align:center; }
        .class-name h3 { font-size:1.4em; color:#333; margin-bottom:2px; }
        .class-type { font-size:.85em; color:#777; font-weight:500; }
        .stat-bar { margin:6px 0; font-size:.9em; }
        .stat-label { display:flex; justify-content:space-between; margin-bottom:2px; color:#555; }
        .stat-value { font-weight:bold; color:#667eea; }
        .progress-bar { width:100%; height:8px; background:#e0e0e0; border-radius:4px; overflow:hidden; }
        .progress-fill { height:100%; background:linear-gradient(90deg,#667eea,#764ba2); border-radius:4px; }
        .skill-section { margin-top:14px; padding-top:14px; border-top:1px solid #ddd; }
        .skill-item { margin:6px 0; font-size:.9em; display:flex; align-items:flex-start; gap:6px; }
        .sk-icon { font-size:1.1em; min-width:22px; text-align:center; }
        .skill-name { font-weight:bold; color:#333; }
        .skill-desc { font-size:.82em; color:#666; margin-left:28px; }
        .passive-item { margin:6px 0; padding:8px; background:#fff3cd; border-left:3px solid #ffc107; border-radius:4px; font-size:.88em; }
        .resource-badge { display:inline-block; padding:3px 8px; border-radius:12px; font-size:.75em; font-weight:bold; margin-top:8px; }
        .fury-badge { background:#ffe0e0; color:#d32f2f; }
        .energy-badge { background:#fff3e0; color:#f57c00; }
        .mana-badge { background:#e3f2fd; color:#1976d2; }
        .growth-row { display:flex; gap:12px; margin-top:10px; font-size:.82em; color:#666; flex-wrap:wrap; }
        .growth-tag { background:#f0f0f0; padding:2px 8px; border-radius:8px; }

        /* Comparison table */
        .comparison-table { width:100%; border-collapse:collapse; background:#fff; border-radius:8px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,.1); }
        .comparison-table thead { background:linear-gradient(135deg,#667eea,#764ba2); color:#fff; }
        .comparison-table th { padding:12px; text-align:left; font-weight:600; font-size:.9em; }
        .comparison-table td { padding:10px 12px; border-bottom:1px solid #e0e0e0; font-size:.9em; }
        .comparison-table tbody tr:hover { background:#f5f5f5; }
        .comparison-table tbody tr:last-child td { border-bottom:none; }
        .role-badge { display:inline-block; padding:3px 8px; border-radius:4px; font-size:.8em; font-weight:bold; background:#e8eaf6; color:#667eea; }
        .rank-1 { background:#ffd700; color:#333; font-weight:bold; }
        .rank-2 { background:#c0c0c0; color:#333; }
        .rank-3 { background:#cd7f32; color:#fff; }

        /* Skill master table */
        .skill-table { width:100%; border-collapse:collapse; background:#fff; border-radius:8px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,.1); margin-bottom:20px; }
        .skill-table thead { background:linear-gradient(135deg,#667eea,#764ba2); color:#fff; }
        .skill-table th { padding:10px 12px; text-align:left; font-weight:600; font-size:.85em; }
        .skill-table td { padding:8px 12px; border-bottom:1px solid #e0e0e0; font-size:.85em; }
        .skill-table tbody tr:hover { background:#f5f5f5; }
        .skill-table .passive-row { background:#fffde7; }

        /* Party */
        .party-recommendation { background:#f5f5f5; border:2px solid #e0e0e0; border-radius:10px; padding:20px; margin-bottom:20px; }
        .party-title { font-size:1.2em; font-weight:bold; color:#333; margin-bottom:14px; padding-bottom:8px; border-bottom:2px solid #667eea; }
        .party-members { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:12px; margin-bottom:14px; }
        .member-card { background:#fff; border:2px solid #667eea; border-radius:8px; padding:10px; text-align:center; }
        .member-icon { font-size:1.8em; margin-bottom:4px; }
        .member-name { font-weight:bold; color:#333; font-size:.95em; }
        .member-desc { font-size:.75em; color:#777; }
        .party-analysis { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
        .analysis-box { background:#fff; border:1px solid #ddd; border-radius:8px; padding:10px; font-size:.88em; }
        .analysis-label { font-weight:bold; color:#667eea; margin-bottom:4px; }

        .divider { height:2px; background:linear-gradient(90deg,transparent,#667eea,transparent); margin:30px 0; }
        footer { background:#f5f5f5; padding:16px; text-align:center; color:#777; border-top:1px solid #e0e0e0; font-size:.9em; }

        /* Character sprites */
        .class-sprites { display:flex; gap:4px; min-width:80px; }
        .char-sprite { width:40px; height:50px; image-rendering:pixelated; }
        /* VFX Demo */
        .vfx-class-btns { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px; }
        .vfx-cls-btn { padding:6px 12px; border:2px solid #667eea; border-radius:8px; background:transparent; color:#667eea; font-weight:600; cursor:pointer; font-size:.85em; transition:all .2s; display:flex; align-items:center; gap:6px; }
        .vfx-cls-btn:hover { background:rgba(102,126,234,.1); }
        .vfx-cls-btn.active { background:#667eea; color:#fff; }
        .vfx-cls-btn img { width:24px; height:30px; image-rendering:pixelated; }
        .vfx-info { display:flex; gap:24px; margin-bottom:20px; flex-wrap:wrap; }
        .vfx-char { text-align:center; }
        .vfx-char img { width:120px; height:150px; image-rendering:pixelated; }
        .vfx-char-name { font-size:1.2em; font-weight:bold; color:#333; margin-top:8px; }
        .vfx-skills { flex:1; min-width:200px; }
        .vfx-skill-item { display:flex; align-items:center; gap:10px; padding:8px 12px; border:1px solid #e0e0e0; border-radius:8px; margin-bottom:8px; background:#f9f9f9; }
        .vfx-skill-item .sk-name { font-weight:bold; flex:1; }
        .vfx-skill-item .sk-cost { font-size:.8em; color:#999; margin-right:8px; }
        .vfx-demo-btn { padding:5px 10px; border:none; border-radius:6px; background:#667eea; color:#fff; font-weight:600; cursor:pointer; font-size:.8em; transition:all .2s; white-space:nowrap; }
        .vfx-demo-btn:hover { background:#764ba2; }
        .vfx-canvas-wrap { display:flex; justify-content:center; margin-top:16px; }
        #vfx-demo-canvas { border-radius:12px; border:2px solid #333; background:#1a1a2e; }

        @media (max-width:768px) {
            main { padding:16px; }
            .class-grid { grid-template-columns:1fr; }
            .party-analysis { grid-template-columns:1fr; }
            .comparison-table { font-size:.8em; }
            .section-title { font-size:1.4em; }
        }
    </style>
</head>
<body data-page="class-balance-report">
    <header id="top-nav">
        <button id="nav-back" onclick="location.href='index.html'"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button>
        <div id="nav-title">클래스 밸런스 리포트</div>
        <button id="nav-settings" onclick="location.href='settings.html'"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
    </header>

    <div class="container">
        <main>
            <div class="tabs" id="main-tabs">
                <button class="tab active" data-tab="tab-cards">클래스 카드</button>
                <button class="tab" data-tab="tab-compare">종합 비교</button>
                <button class="tab" data-tab="tab-skills">스킬 목록</button>
                <button class="tab" data-tab="tab-party">파티 추천</button>
                <button class="tab" data-tab="tab-tips">전략 팁</button>
                <button class="tab" data-tab="tab-vfx">스킬 시연</button>
            </div>

            <div id="tab-cards" class="tab-content active"></div>
            <div id="tab-compare" class="tab-content"></div>
            <div id="tab-skills" class="tab-content"></div>
            <div id="tab-party" class="tab-content"></div>
            <div id="tab-tips" class="tab-content"></div>
            <div id="tab-vfx" class="tab-content"></div>
        </main>
        <footer>DEADLINE 15 클래스 밸런스 리포트 (자동 생성)</footer>
    </div>

<script>
const CLASSES = ['warrior','knight','assassin','mage','archer','priest','novice','brawler','lancer','sapper','summoner','shaman'];
const ROLE_MAP = {
    warrior:'근접 딜러', knight:'방어 탱커', assassin:'암살자', mage:'범위 마법사',
    archer:'원거리 딜러', priest:'힐러/지원', novice:'초보자/만능', brawler:'격투가',
    lancer:'창술사', sapper:'공병/함정', summoner:'소환사', shaman:'주술사/버퍼'
};
const PASSIVE_MAP = {
    warrior: {name:'광폭', desc:'Fury MAX 시 2턴간 ATK x1.5'},
    knight: {name:'몸부림', desc:'Fury MAX 시 2턴간 DEF x1.5'},
    assassin: {name:'은신', desc:'숲 타일에서 자동 은신, 적 겹침 이동 가능'},
};
const MAX_HP=150, MAX_ATK=35, MAX_DEF=20;

// ── Tab switching ──
document.querySelectorAll('.tab').forEach(b => {
    b.onclick = () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        b.classList.add('active');
        document.getElementById(b.dataset.tab).classList.add('active');
    };
});

// ── Helpers ──
function pct(v, max) { return Math.round(v / max * 100); }
function resBadge(res) {
    const m = {fury:'fury-badge', energy:'energy-badge', mana:'mana-badge'};
    return `<span class="resource-badge ${m[res]||''}">${res.charAt(0).toUpperCase()+res.slice(1)}</span>`;
}
function statBar(label, val, max) {
    return `<div class="stat-bar"><div class="stat-label"><span>${label}</span><span class="stat-value">${val}</span></div><div class="progress-bar"><div class="progress-fill" style="width:${pct(val,max)}%"></div></div></div>`;
}

// ── 1. Class Cards ──
function renderCards() {
    let html = '<h2 class="section-title">클래스별 상세 분석</h2><div class="class-grid">';
    CLASSES.forEach(cls => {
        const d = JAB[cls], b = d.base;
        const skills = getSkills(cls);
        const learnables = Object.values(LEARNABLE_SKILLS).filter(s => s.cls === cls);
        const passive = PASSIVE_MAP[cls];

        html += `<div class="class-card"><div class="class-header"><div class="class-sprites"><img class="char-sprite" src="image/character/${cls}_01.png" alt="${cls}"><img class="char-sprite" src="image/character/${cls}_02.png" alt="${cls}"></div><div class="class-name"><h3>${cls.charAt(0).toUpperCase()+cls.slice(1)}</h3><div class="class-type">${ROLE_MAP[cls]}</div></div></div>`;
        html += statBar('HP', b.hp, MAX_HP);
        html += statBar('ATK', b.atk, MAX_ATK);
        html += statBar('DEF', b.def, MAX_DEF);
        html += statBar('MOV', b.move, 4);
        if (b.range > 1) html += statBar('RANGE', b.range, 4);

        // Skills
        html += '<div class="skill-section"><div style="font-weight:600;font-size:.85em;color:#667eea;margin-bottom:6px">기본 스킬</div>';
        skills.forEach(sk => {
            html += `<div class="skill-item"><span class="sk-icon">${sk.icon}</span><span class="skill-name">${sk.name}</span> <span style="color:#999;font-size:.8em;margin-left:4px">${sk.costType} ${sk.cost}</span></div><div class="skill-desc">${sk.desc}</div>`;
        });

        if (learnables.length) {
            const actives = learnables.filter(s => !s.passive);
            const passives = learnables.filter(s => s.passive);
            if (actives.length) {
                html += '<div style="font-weight:600;font-size:.85em;color:#f57c00;margin:10px 0 6px">습득형 스킬</div>';
                actives.forEach(sk => {
                    html += `<div class="skill-item"><span class="sk-icon">${sk.icon}</span><span class="skill-name">${sk.name}</span> <span style="color:#999;font-size:.8em;margin-left:4px">${sk.costType} ${sk.cost}</span></div><div class="skill-desc">${sk.desc}</div>`;
                });
            }
            if (passives.length) {
                passives.forEach(sk => {
                    html += `<div class="passive-item"><strong>${sk.icon} ${sk.name}</strong> (패시브)<br>${sk.desc}</div>`;
                });
            }
        }

        if (passive) {
            html += `<div class="passive-item"><strong>패시브: ${passive.name}</strong><br>${passive.desc}</div>`;
        }
        html += '</div>';

        // Resource + Growth
        html += `<div>${resBadge(d.res)} <span style="font-size:.75em;color:#999">Max ${d.maxRes}${d.resRec ? ' / +' + d.resRec + '/턴' : ''}</span></div>`;
        const g = d.growth;
        html += `<div class="growth-row"><span class="growth-tag">HP +${g.hp[0]}~${g.hp[1]}</span><span class="growth-tag">ATK +${g.atk[0]}~${g.atk[1]}</span><span class="growth-tag">DEF +${g.def[0]}~${g.def[1]}</span></div>`;
        html += '</div>';
    });
    html += '</div>';
    document.getElementById('tab-cards').innerHTML = html;
}

// ── 2. Comparison Table ──
function renderCompare() {
    // Sort helpers
    const sorted = (key) => CLASSES.slice().sort((a,b) => JAB[b].base[key] - JAB[a].base[key]);
    const rankMap = {};
    ['hp','atk','def'].forEach(key => {
        const s = sorted(key);
        s.forEach((cls,i) => { if(!rankMap[cls]) rankMap[cls]={}; rankMap[cls][key]=i; });
    });

    let html = '<h2 class="section-title">종합 비교 테이블</h2>';
    html += '<table class="comparison-table"><thead><tr><th>클래스</th><th>HP</th><th>ATK</th><th>DEF</th><th>MOV</th><th>RANGE</th><th>자원</th><th>Max</th><th>회복</th><th>역할</th></tr></thead><tbody>';
    CLASSES.forEach(cls => {
        const d = JAB[cls], b = d.base;
        const r = rankMap[cls];
        const rc = (i) => i===0?'rank-1':i===1?'rank-2':i===2?'rank-3':'';
        html += `<tr>
            <td><strong>${d.icon} ${cls.charAt(0).toUpperCase()+cls.slice(1)}</strong></td>
            <td class="${rc(r.hp)}">${b.hp}</td>
            <td class="${rc(r.atk)}">${b.atk}</td>
            <td class="${rc(r.def)}">${b.def}</td>
            <td>${b.move}</td>
            <td>${b.range}</td>
            <td>${d.res}</td>
            <td>${d.maxRes}</td>
            <td>${d.resRec||'-'}</td>
            <td><span class="role-badge">${ROLE_MAP[cls]}</span></td>
        </tr>`;
    });
    html += '</tbody></table>';

    // Stat rankings
    html += '<div class="divider"></div><h3 style="color:#667eea;margin-bottom:16px">스탯 순위</h3>';
    html += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px">';
    [{key:'hp',label:'HP 순위',emoji:'❤️'},{key:'atk',label:'ATK 순위',emoji:'⚔️'},{key:'def',label:'DEF 순위',emoji:'🛡️'}].forEach(({key,label,emoji}) => {
        const s = sorted(key);
        html += `<div style="background:#f9f9f9;padding:16px;border-radius:8px"><h4 style="color:#667eea;margin-bottom:8px">${emoji} ${label}</h4>`;
        s.forEach((cls,i) => {
            const medal = i===0?'🥇':i===1?'🥈':i===2?'🥉':`${i+1}.`;
            html += `<div style="font-size:.88em;padding:3px 0">${medal} ${JAB[cls].icon} ${cls} <strong>${JAB[cls].base[key]}</strong></div>`;
        });
        html += '</div>';
    });
    html += '</div>';

    document.getElementById('tab-compare').innerHTML = html;
}

// ── 3. Skill Master List ──
function renderSkills() {
    let html = '<h2 class="section-title">전체 스킬 목록</h2>';

    // Base skills
    html += '<h3 style="color:#667eea;margin-bottom:12px">기본 스킬</h3>';
    html += '<table class="skill-table"><thead><tr><th>클래스</th><th>스킬명</th><th>설명</th><th>비용</th></tr></thead><tbody>';
    CLASSES.forEach(cls => {
        getSkills(cls).forEach(sk => {
            html += `<tr><td>${JAB[cls].icon} ${cls}</td><td><strong>${sk.icon} ${sk.name}</strong></td><td>${sk.desc}</td><td>${sk.cost} ${sk.costType}</td></tr>`;
        });
    });
    html += '</tbody></table>';

    // Learnable skills by class
    html += '<div class="divider"></div><h3 style="color:#f57c00;margin-bottom:12px">습득형 스킬 (스킬북)</h3>';
    html += '<table class="skill-table"><thead><tr><th>클래스</th><th>스킬명</th><th>타입</th><th>설명</th><th>비용</th></tr></thead><tbody>';
    CLASSES.forEach(cls => {
        const learnables = Object.values(LEARNABLE_SKILLS).filter(s => s.cls === cls);
        learnables.forEach(sk => {
            const isPassive = sk.passive;
            html += `<tr class="${isPassive?'passive-row':''}"><td>${JAB[cls].icon} ${cls}</td><td><strong>${sk.icon} ${sk.name}</strong></td><td>${isPassive?'<span style="color:#f57c00">패시브</span>':'액티브'}</td><td>${sk.desc}</td><td>${isPassive?'-':sk.cost+' '+sk.costType}</td></tr>`;
        });
    });
    html += '</tbody></table>';

    // Skill count summary
    html += '<div class="divider"></div><h3 style="color:#667eea;margin-bottom:12px">클래스별 스킬 수 요약</h3>';
    html += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px">';
    CLASSES.forEach(cls => {
        const base = getSkills(cls).length;
        const learn = Object.values(LEARNABLE_SKILLS).filter(s => s.cls === cls);
        const actives = learn.filter(s => !s.passive).length;
        const passives = learn.filter(s => s.passive).length;
        html += `<div style="background:#f9f9f9;padding:12px;border-radius:8px;text-align:center">
            <div style="font-size:1.5em">${JAB[cls].icon}</div>

function _vfxSpawn(cvs, cx, cy, opts) {
    const cnt = opts.count || 8;
    for (let i = 0; i < cnt; i++) {
        _vfxParts.push({
            x: cx + (Math.random() - .5) * (opts.spread || 10),
            y: cy + (Math.random() - .5) * (opts.spread || 10),
            vx: (Math.random() - .5) * (opts.speed || 2),
            vy: opts.vy !== undefined ? (opts.vy + (Math.random() - .5)) : (-Math.random() * (opts.speed || 2)),
            life: 1, decay: opts.decay || (0.015 + Math.random() * 0.02),
            size: opts.size || (2 + Math.random() * 3),
            color: opts.colors[Math.floor(Math.random() * opts.colors.length)],
            shape: opts.shape || 'circle',
            gravity: opts.gravity || 0,
            rotation: Math.random() * Math.PI * 2,
            rotSpd: (Math.random() - .5) * 0.2
        });
    }
    if (!_vfxRaf) _vfxLoop(cvs);
}

function _drawStar(ctx, x, y, r) {
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
        ctx.lineTo(x + r * Math.cos(i * 1.256 - .785), y + r * Math.sin(i * 1.256 - .785));
        ctx.lineTo(x + r * .4 * Math.cos(i * 1.256 + .628 - .785), y + r * .4 * Math.sin(i * 1.256 + .628 - .785));
    }
    ctx.closePath(); ctx.fill();
}

function _vfxLoop(cvs) {
    const ctx = cvs.getContext('2d');
    ctx.clearRect(0, 0, cvs.width, cvs.height);
    for (let i = _vfxParts.length - 1; i >= 0; i--) {
        const p = _vfxParts[i];
        p.x += p.vx; p.y += p.vy; p.vy += p.gravity; p.life -= p.decay; p.rotation += p.rotSpd;
        if (p.life <= 0) { _vfxParts.splice(i, 1); continue; }
        ctx.save(); ctx.globalAlpha = p.life; ctx.fillStyle = p.color;
        ctx.shadowColor = p.color; ctx.shadowBlur = p.size * p.life * 2.5;
        ctx.translate(p.x, p.y); ctx.rotate(p.rotation);
        if (p.shape === 'circle') { ctx.beginPath(); ctx.arc(0, 0, p.size * p.life, 0, Math.PI * 2); ctx.fill(); }
        else if (p.shape === 'star') { _drawStar(ctx, 0, 0, p.size * p.life); }
        else if (p.shape === 'slash') {
            ctx.strokeStyle = p.color; ctx.lineWidth = p.size * p.life * 0.8; ctx.lineCap = 'round';
            ctx.beginPath(); ctx.moveTo(-p.size * 2.5, p.size * 2.5); ctx.lineTo(p.size * 2.5, -p.size * 2.5); ctx.stroke();
        }
        else if (p.shape === 'spark') {
            ctx.strokeStyle = p.color; ctx.lineWidth = 1.5; ctx.beginPath();
            ctx.moveTo(0, 0); ctx.lineTo(-p.vx * 4, -p.vy * 4); ctx.stroke();
            ctx.beginPath(); ctx.arc(0, 0, p.size * p.life * 0.6, 0, Math.PI * 2); ctx.fill();
        }
        else if (p.shape === 'ring') {
            ctx.strokeStyle = p.color; ctx.lineWidth = 2 * p.life;
            ctx.beginPath(); ctx.arc(0, 0, p.size * (1 - p.life) * 3.5 + 2, 0, Math.PI * 2); ctx.stroke();
        }
        else if (p.shape === 'arrow') {
            ctx.strokeStyle = p.color; ctx.lineWidth = 2 * p.life; ctx.lineCap = 'round';
            ctx.beginPath(); ctx.moveTo(0, p.size * 3); ctx.lineTo(0, -p.size * 3);
            ctx.moveTo(-p.size, -p.size); ctx.lineTo(0, -p.size * 3); ctx.lineTo(p.size, -p.size); ctx.stroke();
        }
        else if (p.shape === 'diamond') {
            ctx.beginPath(); const s = p.size * p.life;
            ctx.moveTo(0, -s); ctx.lineTo(s, 0); ctx.lineTo(0, s); ctx.lineTo(-s, 0); ctx.closePath(); ctx.fill();
        }
        else if (p.shape === 'cross') {
            ctx.strokeStyle = p.color; ctx.lineWidth = p.size * p.life * 0.5; ctx.lineCap = 'round';
            const s = p.size * 2; ctx.beginPath();
            ctx.moveTo(-s, 0); ctx.lineTo(s, 0); ctx.moveTo(0, -s); ctx.lineTo(0, s); ctx.stroke();
        }
        ctx.restore();
    }
    if (_vfxParts.length) _vfxRaf = requestAnimationFrame(() => _vfxLoop(cvs));
    else { _vfxRaf = null; }
}

function playVfx(skillKey) {
    const cvs = document.getElementById('vfx-demo-canvas');
    if (!cvs) return;
    const data = SKILL_VFX[skillKey];
    if (!data) return;
    _vfxParts.length = 0;
    if (_vfxRaf) { cancelAnimationFrame(_vfxRaf); _vfxRaf = null; }
    const ctx = cvs.getContext('2d');
    ctx.fillStyle = data[0]?.opts?.colors?.[0] || '#fff';
    ctx.globalAlpha = 0.15;
    ctx.fillRect(0, 0, cvs.width, cvs.height);
    ctx.globalAlpha = 1;
    const cx = cvs.width / 2, cy = cvs.height / 2;
    data.forEach(d => {
        setTimeout(() => _vfxSpawn(cvs, cx + (d.x||0), cy + (d.y||0), d.opts), d.delay || 0);
    });
}

    let html = '<h2 class="section-title">스킬 VFX 시연</h2>';
    html += '<div class="vfx-class-btns">';
    CLASSES.forEach(cls => {
        const d = JAB[cls];
        html += `<button class="vfx-cls-btn" data-cls="${cls}" onclick="selectDemoCls('${cls}')"><img src="image/character/${cls}_01.png" alt="${cls}">${cls.charAt(0).toUpperCase()+cls.slice(1)}</button>`;
    });
    html += '</div>';
    html += '<div id="vfx-info-area" style="min-height:200px"></div>';
    html += '<div class="vfx-canvas-wrap"><canvas id="vfx-demo-canvas" width="400" height="300"></canvas></div>';
    document.getElementById('tab-vfx').innerHTML = html;
}

function selectDemoCls(cls) {
    document.querySelectorAll('.vfx-cls-btn').forEach(b => b.classList.toggle('active', b.dataset.cls === cls));
    const d = JAB[cls];
    let html = '<div class="vfx-info">';
    html += `<div class="vfx-char"><img src="image/character/${cls}_01.png" alt="${cls}"><div class="vfx-char-name">${d.icon} ${cls.charAt(0).toUpperCase()+cls.slice(1)}</div><div style="font-size:.85em;color:#777">${ROLE_MAP[cls]}</div></div>`;
    html += '<div class="vfx-skills">';
    html += `<div class="vfx-skill-item"><span class="sk-icon">⚔️</span><span class="sk-name">기본공격</span><span class="sk-cost"></span><button class="vfx-demo-btn" onclick="playVfx('${cls}_basic')">시연</button></div>`;
    const skills = getSkills(cls);
    skills.forEach(sk => {
        const hasVfx = SKILL_VFX[sk.id];
        html += `<div class="vfx-skill-item"><span class="sk-icon">${sk.icon}</span><span class="sk-name">${sk.name}</span><span class="sk-cost">${sk.cost} ${sk.costType}</span>${hasVfx ? `<button class="vfx-demo-btn" onclick="playVfx('${sk.id}')">시연</button>` : ''}</div>`;
    });
    const learnables = Object.entries(LEARNABLE_SKILLS).filter(([k,v]) => v.cls === cls);
    if (learnables.length) {
        html += '<div style="font-weight:600;font-size:.85em;color:#f57c00;margin:12px 0 6px">습득형 스킬</div>';
        learnables.forEach(([key, sk]) => {
            if (sk.passive) {
                html += `<div class="vfx-skill-item" style="background:#fffde7"><span class="sk-icon">${sk.icon}</span><span class="sk-name">${sk.name}</span><span class="sk-cost" style="color:#f57c00">패시브</span></div>`;
            } else {
                const hasVfx = SKILL_VFX[key];
                html += `<div class="vfx-skill-item"><span class="sk-icon">${sk.icon}</span><span class="sk-name">${sk.name}</span><span class="sk-cost">${sk.cost} ${sk.costType}</span>${hasVfx ? `<button class="vfx-demo-btn" onclick="playVfx('${key}')">시연</button>` : ''}</div>`;
            }
        });
    }
    html += '</div></div>';
    document.getElementById('vfx-info-area').innerHTML = html;
}
