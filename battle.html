<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>DEADLINE 15</title>
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/battle.css">
<script src="js/common/i18n.js"></script>
<script src="js/common/modal.js"></script>
<script src="data/jab.js"></script>
<!-- 공통 모듈 (의존성 순서) -->
<script src="js/common/constants.js"></script>
<script src="js/common/storage.js"></script>
<script src="js/common/character.js"></script>
<script src="js/common/render.js"></script>
<script src="data/stages.js"></script>
<script src="data/tiles.js"></script>
<script src="data/equip.js"></script>
<script src="js/skills.js"></script>
<script src="js/skills/_common.js"></script>
<script src="js/skills/_registry.js"></script>
<script src="js/skills/warrior.js"></script>
<script src="js/skills/knight.js"></script>
<script src="js/skills/assassin.js"></script>
<script src="js/skills/mage.js"></script>
<script src="js/skills/archer.js"></script>
<script src="js/skills/priest.js"></script>
<script src="js/skills/novice.js"></script>
<script src="js/skills/summoner.js"></script>
<script src="js/skills/shaman.js"></script>
<script src="js/skills/brawler.js"></script>
<script src="js/skills/lancer.js"></script>
<script src="js/skills/sapper.js"></script>
<script src="js/sprites.js"></script>
<script src="js/battle/constants.js"></script>
<script src="js/battle/core.js"></script>
<script src="js/battle/combat.js"></script>
<script src="js/battle/render.js"></script>
<script src="js/battle/ui.js"></script>
<script src="js/battle/vfx.js"></script>
<script src="js/battle/audio.js"></script>
<script src="js/battle/ai.js"></script>
<script src="js/battle/end.js"></script>
<script src="js/battle/boot.js"></script>
</head>
<body data-page="battle">
<div id="battle-loading">
  <div class="bl-content">
    <div class="bl-title" id="bl-stage-name"></div>
    <div class="bl-bar"><div class="bl-fill" id="bl-fill"></div></div>
    <div class="bl-tip" id="bl-tip"></div>
  </div>
</div>
<div id="app">
  <div id="top-bar">
    <div class="tb-left">
      <div id="turn-indicator" class="player">PLAYER</div>
      <button class="cam-btn" onclick="G.rotCam(-1)" title="카메라 좌회전 (Q)"><svg viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg></button>
      <button class="cam-btn" onclick="G.rotCam(1)" title="카메라 우회전 (E)"><svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg></button>
    </div>
    <div id="stage-info">STAGE 1<div class="si-turn">TURN 1</div></div>
    <div class="tb-right"></div>
  </div>
  <div id="map-container">
    <div id="iso-world">
      <canvas id="vfx-canvas"></canvas>
      <div id="action-menu" onclick="event.stopPropagation()">
        <button id="btn-move" onclick="G.actMove()" style="display:none" data-i18n="battle.move">👣 이동</button>
        <button id="btn-attack" onclick="G.actAttack()" style="display:none" data-i18n="battle.attack">⚔️ 공격</button>
        <button id="btn-skill" onclick="G.showSkillMenu()" style="display:none" data-i18n="battle.skill">🔱 스킬</button>
        <button id="btn-item" onclick="G.actItem()" style="display:none" data-i18n="battle.item">🎒 아이템</button>
        <button id="btn-dash" onclick="G.actWait()" data-i18n="battle.wait">⏸ 대기</button>
        <button id="btn-cancel" onclick="G.actCancel()" style="display:none" data-i18n="battle.cancel">↩ 취소</button>
      </div>
    </div>
  </div>
  <div id="info-panel"><div style="color:var(--dim);font-size:11px" data-i18n="common.select_unit">유닛을 선택하세요</div></div>
</div>
<div id="turn-flash"></div>
<div id="cam-dir"><div class="cd-arrow">▲</div><div class="cd-label">N</div></div>
<div id="ally-nav"></div>
<div id="minimap"><canvas id="mm-cv"></canvas><div class="mm-vp" id="mm-vp"></div></div>
<button id="settings-btn" onclick="G.toggleSettings()" title="설정"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
<div id="settings-backdrop" onclick="G.closeSettings()"></div>
<div id="settings-panel">
  <div class="sp-title"><i class="sp-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></i> <span data-i18n="settings.title"></span></div>
  <div class="sp-toggle"><span class="sp-tlabel"><i class="sp-icon"><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></i> <span data-i18n="settings.bgm"></span></span><label class="sp-switch"><input type="checkbox" id="sp-bgm-on" checked onchange="G.setBGMOn(this.checked)"><span class="slider"></span></label></div>
  <div class="sp-row"><span class="sp-label" data-i18n="settings.volume"></span><input type="range" id="sp-bgm" min="0" max="100" value="60" oninput="G.setBGMVol(this.value)"><span class="sp-val" id="sp-bgm-val">60</span></div>
  <div class="sp-toggle"><span class="sp-tlabel"><i class="sp-icon"><svg viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg></i> <span data-i18n="settings.sfx"></span></span><label class="sp-switch"><input type="checkbox" id="sp-sfx-on" checked onchange="G.setSFXOn(this.checked)"><span class="slider"></span></label></div>
  <div class="sp-row"><span class="sp-label" data-i18n="settings.volume"></span><input type="range" id="sp-sfx" min="0" max="100" value="80" oninput="G.setSFXVol(this.value)"><span class="sp-val" id="sp-sfx-val">80</span></div>
  <div class="sp-divider"></div>
  <div class="sp-row"><span class="sp-label"><i class="sp-icon"><svg viewBox="0 0 24 24"><polygon points="13 19 22 12 13 5 13 19"/><polygon points="2 19 11 12 2 5 2 19"/></svg></i> <span data-i18n="settings.game_speed"></span></span><input type="range" id="sp-speed" min="50" max="200" value="100" step="25" oninput="G.setSpeed(this.value)"><span class="sp-val" id="sp-speed-val">1.0x</span></div>
  <div class="sp-divider"></div>
  <div class="sp-btn-row">
    <button class="sp-btn" onclick="G.closeSettings()" data-i18n="common.close"></button>
    <button class="sp-btn danger" onclick="G.surrender()"><i class="sp-icon"><svg viewBox="0 0 24 24"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg></i> <span data-i18n="battle.surrender"></span></button>
  </div>
</div>
<div id="wave-banner"></div>
<div id="modal-overlay"><div id="modal-box"><div id="modal-title"></div><div id="modal-sub"></div><div id="modal-buttons"></div></div></div>
</body>
</html>
