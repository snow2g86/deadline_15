<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>가이드</title>
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/codex.css">
<script src="data/jab.js"></script>
<script src="js/common/constants.js"></script>
<script src="js/common/render.js"></script>
<script src="data/stages.js"></script>
<script src="js/common/daily.js"></script>
<script src="data/synergy.js"></script>
<script src="data/equip.js"></script>
<script src="data/gear.js"></script>
<script src="data/hazards.js"></script>
<script src="js/common/i18n.js"></script>
<script src="js/common/nav.js"></script>
</head>
<body data-page="compendium-guide" class="codex">

<header id="top-nav">
  <button id="nav-back" onclick="history.back()"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button>
  <div id="nav-title"></div>
  <button id="nav-settings" onclick="location.href='settings.html'"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
</header>

<main>
  <section class="cx-hero">
    <div class="cx-emblem">📚</div>
    <h1 data-k="g.title"></h1>
    <p data-k="g.sub"></p>
    <div class="cx-stats">
      <div class="cx-stat"><b>100</b><span data-k="c.st_stages"></span></div>
      <div class="cx-stat"><b>5</b><span data-k="c.st_party"></span></div>
      <div class="cx-stat"><b>12</b><span data-k="c.st_classes"></span></div>
    </div>
  </section>
  <nav class="cx-tabs" id="tabs">
    <button class="cx-tab on" data-tab="start" data-k="g.tab_start"></button>
    <button class="cx-tab" data-tab="grow" data-k="g.tab_grow"></button>
    <button class="cx-tab" data-tab="gear" data-k="g.tab_gear"></button>
    <button class="cx-tab" data-tab="battle" data-k="g.tab_battle"></button>
    <button class="cx-tab" data-tab="map" data-k="g.tab_map"></button>
    <button class="cx-tab" data-tab="route" data-k="g.tab_route"></button>
    <button class="cx-tab" data-tab="story" data-k="g.tab_story"></button>
  </nav>
  <div class="cx-wrap" id="cx-body"></div>
</main>

<script>
// ═══ 가이드: 문장은 번역 키(codex.g.* / codex.c.*, data/language/*/codex.js), 표는 게임 데이터 ═══
const $ = id => document.getElementById(id);
const T = (k, p) => t('codex.' + k, p);
const tt = (k, fb, p) => { const v = t(k, p); return v && v !== k ? v : (fb != null ? fb : k); };
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const ico = (key, size, emo) => typeof iconOr === 'function' ? iconOr(key, size, emo) : (emo || '');
const sec = (h, sm, inner) => `<div class="cx-sec"><div class="cx-sec-h"><h2>${T(h)}</h2><small>${sm}</small></div>${inner}</div>`;
const card = (ic, h, p) => `<div class="cx-card"><h3><span class="cx-ic">${ic}</span>${T(h)}</h3><p>${T(p)}</p></div>`;
const note = (cls, ic, k, p) => `<div class="cx-note ${cls}"><i>${ic}</i><div>${T(k, p)}</div></div>`;
const table = (cls, head, rows) => `<div class="cx-table-w"><table class="cx-table ${cls}"><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr>${rows.join('')}</table></div>`;
const ODDS = k => T('c.odd_' + k);

function build() {
  const g = {};
  // 시작
  g.start = sec('g.s_overview', 'overview', `<p class="cx-lead">${T('g.overview_p')}</p>${note('warn', '📈', 'g.overview_warn')}`) +
    sec('g.s_first', 'first steps', card('1', 'g.first1_h', 'g.first1_p') + card('2', 'g.first2_h', 'g.first2_p') + card('3', 'g.first3_h', 'g.first3_p')) +
    sec('g.s_daily', 'daily', `<div class="cx-grid2">${card('🗓️', 'g.daily1_h', 'g.daily1_p')}${card('🛒', 'g.daily2_h', 'g.daily2_p')}</div>`);
  // 성장
  const grades = [['C', 0.8, '−'], ['B', 0.9, '−'], ['A', 1.0, T('c.soul_ba', { n: SOUL.promote.B })], ['S', 1.1, T('c.soul_as', { n: SOUL.promote.A })]]
    .map(([gr, m, so]) => `<tr><td>${gr}</td><td class="n">${GRADE_LV_CAP[gr]}</td><td class="n">×${m}</td><td>${so}</td></tr>`);
  g.grow = sec('g.s_level', 'level · grade', table('', [T('c.th_grade'), T('c.th_lvcap'), T('c.th_mult'), T('c.th_soul')], grades) + note('tip', '💡', 'g.level_tip')) +
    sec('g.s_promote', 'sanctuary', `<div class="cx-card"><ul><li>${T('g.promote_li1')}</li><li>${T('g.promote_soul', { a: SOUL.promote.B, b: SOUL.promote.A })}</li><li>${T('g.promote_li3')}</li></ul></div>${note('', '💠', 'g.promote_note')}`) +
    sec('g.s_gold', 'gold', `<div class="cx-card"><h3><span class="cx-ic">🪙</span>${T('g.gold_h')}</h3><ul>${[1, 2, 3, 4, 5, 6].map(i => `<li>${T('g.gold_' + i)}</li>`).join('')}</ul></div>${note('warn', '⚠️', 'g.gold_warn')}`);
  // 장비
  const rar = RARITY_ORDER.map(r => `<tr><td style="color:${RARITY[r].color}">${RARITY[r].grade} ${esc(tt('equip.rarity.' + r, r).replace(/^[A-Z] - /, ''))}</td><td class="n">${SUB_COUNT[r]}</td><td>${RARITY[r].tier >= 2 ? '○' : '−'}</td><td>${r === 'legendary' ? T('c.legend_fx19') : r === 'epic' ? T('c.random1') : '−'}</td></tr>`);
  const enh = ENHANCE_RATES.map((p, lv) => `<tr><td>+${lv}→+${lv + 1}</td><td class="n">${Math.round(p * 100)}%</td><td>${lv < ENHANCE_SAFE_BELOW ? T('c.keep') : T('c.drop1')}</td><td class="n">${ENHANCE_STONES[lv]}</td><td class="n">+${ENHANCE_STAT_PCT[lv + 1]}%</td></tr>`);
  const picks = ['unyielding', 'saint_tear', 'king_seal', 'dragon_scale'].filter(k => LEGENDS[k]).map(k => `<span class="cx-pill g">${ico('legend_' + k, 14, '★')} ${esc(tt('gear.legend.' + k))}</span>`).join('');
  g.gear = sec('g.s_gearstruct', 'equipment', `<div class="cx-grid2">${card('🗡️', 'g.wpn_h', 'g.wpn_p')}${card('🥋', 'g.arm_h', 'g.arm_p')}</div><div style="margin-top:10px">${table('', [T('c.th_grade'), T('c.th_sub'), T('c.th_copt'), T('c.th_unique')], rar)}</div>${note('tip', '🎯', 'g.copt_tip')}`) +
    sec('g.s_enh', 'enhance', table('', [T('c.th_step'), T('c.th_success'), T('c.th_onfail'), T('c.th_stones'), T('c.th_stat')], enh) +
      `<div class="cx-grid2" style="margin-top:10px">${card('💥', 'g.break_h', 'g.break_p')}${card('✨', 'g.eopt_h', 'g.eopt_p')}</div>
       <div class="cx-card" style="margin-top:10px"><h3><span class="cx-ic">💡</span>${T('g.tips_h')}</h3><ul>${[1, 2, 3, 4].map(i => `<li>${T('g.tip' + i)}</li>`).join('')}</ul></div>`) +
    sec('g.s_legset', 'legend · set', `<div class="cx-grid2"><div class="cx-card"><h3><span class="cx-ic">★</span>${T('g.leg_h')}</h3><p>${T('g.leg_p')}</p><div class="cx-pills">${picks}</div></div>${card('🔗', 'g.set_h', 'g.set_p')}</div><p class="cx-lead" style="margin-top:10px">${T('g.more_gear')}</p>`);
  // 전투
  const PC = ['warrior','knight','lancer','brawler','assassin','archer','mage','summoner','shaman','priest','sapper','novice'];
  const syn = PC.filter(c => SYNERGY_MONO[c]).map(c => `<tr><td>${clsIcon(c, 18)} ${esc(tt('classes.' + c))}</td><td><b style="color:var(--cx-gold2)">${esc(Synergy.name({ id: 'mono_' + c, cls: c }))}</b><br>${esc(Synergy.describe({ eff: SYNERGY_MONO[c].eff }))}</td><td>${SYNERGY_TRIO[c] ? esc(Synergy.describe({ eff: SYNERGY_TRIO[c] })) : '−'}</td></tr>`);
  const tac = [1, 2, 3, 4, 5, 6, 7, 8, 9].map(i => '<tr>' + T('g.t' + i).split('|').map(x => `<td>${esc(x)}</td>`).join('') + '</tr>');
  g.battle = sec('g.s_syn', 'synergy', `<p class="cx-lead">${T('g.syn_p')}</p>` + table('nw', [T('c.th_cls'), T('c.n5'), T('c.n3')], syn)) +
    sec('g.s_tactics', 'tactics', table('', [T('g.th_elem'), T('g.th_effect'), T('g.th_use')], tac)) +
    sec('g.s_win', 'stars', `<div class="cx-grid2">${card('🏰', 'g.def_h', 'g.def_p')}${card('⚔️', 'g.off_h', 'g.off_p')}${card('⭐', 'g.star_h', 'g.star_p')}</div>`);
  // 맵 환경
  const hz = Object.keys(HAZARDS).map(m => { const h = HAZARDS[m]; return `<div class="cx-card"><h3><span class="cx-ic">${h.icon}</span>${esc(tt('hazard.' + h.id, h.id))}</h3><p>${esc(Hazard.describe(h, STAGES[0]))}</p></div>`; }).join('');
  const runes = Rune.kinds('atk').map(k => `<div class="cx-card"><h3><span class="cx-ic">${ico('rune_' + k, 22, ENCHANTS[k].icon)}</span>${esc(tt('enchant.' + k, k))}</h3><p>${esc(tt('enchant.desc_' + k, ''))}</p></div>`).join('');
  const odds = Object.keys(CHEST.odds).map(k => `<span class="cx-pill">${ODDS(k)} ${Math.round(CHEST.odds[k] * 100)}%</span>`).join('');
  g.map = sec('g.s_hz', 'hazards', `<p class="cx-lead">${T('g.hz_p')}</p><div class="cx-grid2">${hz}</div>${note('tip', '☄️', 'g.hz_tip')}`) +
    sec('g.s_enchant', 'enchant', `<div class="cx-card"><ul><li>${T('g.ench1')}</li><li>${T('g.ench2')}</li><li>${T('g.ench3')}</li></ul></div><div class="cx-grid2" style="margin-top:10px">${runes}</div>`) +
    sec('g.s_chest', 'chest', `<div class="cx-card"><p>${T('g.chest_p')}</p><div class="cx-pills">${odds}</div></div>`);
  // 구간 공략
  const eps = {}; STAGES.forEach(s => { const e = Math.ceil(s.id / 10); (eps[e] = eps[e] || []).push(s); });
  const acc = Object.keys(eps).map(e => {
    const ss = eps[e], bosses = ss.filter(s => s.boss).map(s => `${s.id} ${bossName(s)}`);
    const maps = [...new Set(ss.map(s => Hazard.forStage(s)).filter(Boolean).map(h => h.icon + ' ' + tt('hazard.' + h.id, h.id)))];
    const meta = T('g.route_meta', { a: (e - 1) * 10 + 1, b: e * 10, c: Math.min(...ss.map(s => s.tot)), d: Math.max(...ss.map(s => s.tot)), e: stageEnemyLv(ss[0].id), f: stageEnemyLv(ss[ss.length - 1].id) });
    return `<details class="cx-acc"><summary><span class="cx-ic">${e}</span><span>${esc(tt('episode.' + e + '.name', 'Ep' + e))}<br><small>${meta}</small></span></summary>
      <div class="cx-acc-b"><p class="cx-lead" style="margin:0 0 8px">${T('g.r' + e)}</p>
      <div class="cx-pills">${bosses.map(b => `<span class="cx-pill r">💀 ${esc(b)}</span>`).join('')}${maps.map(m => `<span class="cx-pill p">${esc(m)}</span>`).join('')}</div></div></details>`;
  }).join('');
  const bot = [1, 2, 3, 4].map(i => { const [a, b, c] = T('g.b' + i).split('|'); return `<tr><td>${esc(a)}</td><td class="n">${esc(b)}</td><td>${esc(c)}</td></tr>`; });
  g.route = sec('g.s_route', 'route', acc) + sec('g.s_bot', 'autoplay', table('', [T('g.th_combo'), T('g.th_reach'), T('g.th_trait')], bot) + note('', '🤖', 'g.bot_note'));
  // 스토리: 등장인물 (docs/CAST.md, 초상화 image/character/story)
  const pp = key => `<span class="cx-pp" style="background-image:url(image/character/story/${key}.png)"></span>`;
  const person = (key, h, r, p) => `<div class="cx-card cx-person">${pp(key)}<div><h3>${h}</h3>${r ? `<div class="cx-role">${r}</div>` : ''}<p>${p}</p></div></div>`;
  const cast = ['bram', 'sera', 'bark', 'kasha', 'ordin'].map(k => person(k, T('g.cast_' + k + '_n'), T('g.cast_' + k + '_r'), T('g.cast_' + k + '_p'))).join('');
  const bosses = STAGES.filter(s => s.boss).map(s => person('boss_' + s.id, `<span class="cx-pill r">${s.id}</span> ${esc(bossName(s))}`, '', T('g.boss_' + s.id))).join('');
  g.story = sec('g.s_story', 'story', `<p class="cx-lead">${T('g.story_p')}</p>`) +
    sec('g.s_hero', 'commander', `<div class="cx-card cx-person">${pp('commander_m')}${pp('commander_f')}<div><h3>${T('g.hero_h')}</h3><p>${T('g.hero_p')}</p></div></div>`) +
    sec('g.s_cast', 'cast', `<div class="cx-grid2">${cast}</div>`) +
    sec('g.s_boss', 'bosses', `<p class="cx-lead">${T('g.boss_p')}</p><div class="cx-grid2">${bosses}</div>`) +
    sec('g.s_spoil', 'spoiler', `<details class="cx-acc"><summary><span class="cx-ic">!</span><span>${T('g.spoil_sum')}</span></summary><div class="cx-acc-b"><div class="cx-card"><ul>${[1, 2, 3, 4, 5].map(i => `<li>${T('g.spoil_' + i)}</li>`).join('')}</ul></div></div></details>`);

  $('cx-body').innerHTML = Object.keys(g).map((k, i) => `<div class="cx-panel ${i ? '' : 'on'}" id="p-${k}">${g[k]}</div>`).join('') + `<div class="cx-foot">${T('g.foot')}</div>`;
}

document.querySelectorAll('#tabs .cx-tab').forEach(btn => btn.onclick = () => {
  document.querySelectorAll('#tabs .cx-tab').forEach(b => b.classList.toggle('on', b === btn));
  document.querySelectorAll('.cx-panel').forEach(p => p.classList.toggle('on', p.id === 'p-' + btn.dataset.tab));
  document.querySelector('main').scrollTo({ top: document.querySelector('.cx-hero').offsetHeight, behavior: 'smooth' });
});

document.addEventListener('DOMContentLoaded', async () => {
  if (typeof loadI18n === 'function') await loadI18n();
  $('nav-title').textContent = tt('nav.guide', T('g.title'));
  document.title = T('g.title');
  document.querySelectorAll('[data-k]').forEach(el => { el.innerHTML = T(el.dataset.k); });
  build();
  const tab = new URLSearchParams(location.search).get('tab');
  if (tab) { const b = document.querySelector(`#tabs [data-tab="${tab}"]`); if (b) b.click(); }
});
</script>
<script src="js/common/item-icons.js"></script>
<script src="js/common/emoji-icons.js"></script>
</body>
</html>
