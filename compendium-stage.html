<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🗺 스테이지 도감</title>
<script src="data/jab.js"></script>
<script defer src="js/common/i18n.js"></script>
<script defer src="js/common/nav.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=JetBrains+Mono:wght@400;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0e1a;--card:#111827;--border:#1e293b;
  --text:#e2e8f0;--dim:#64748b;--gold:#f0c040;
  --red:#f87171;--green:#4ade80;--blue:#60a5fa;--purple:#a78bfa;
}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;
  min-height:100vh;padding:0;overflow-x:hidden}
::selection{background:var(--gold);color:var(--bg)}

/* Header */
.header{text-align:center;padding:32px 16px 0;position:relative}
.header h1{font-size:28px;font-weight:900;color:var(--gold);letter-spacing:2px;
  text-shadow:0 0 40px rgba(240,192,64,.25)}
.header .sub{color:var(--dim);font-size:13px;margin-top:4px}

/* Tabs */
.tabs{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;padding:20px 16px 0;position:sticky;top:0;
  z-index:10;background:linear-gradient(var(--bg) 60%,transparent)}
.tab-btn{padding:8px 16px;border:1px solid var(--border);border-radius:8px;background:var(--card);
  color:var(--dim);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;
  transition:all .2s}
.tab-btn:hover{border-color:var(--gold);color:var(--text)}
.tab-btn.active{background:var(--gold);color:var(--bg);border-color:var(--gold);
  box-shadow:0 0 20px rgba(240,192,64,.3)}

/* Content */
.content{max-width:900px;margin:0 auto;padding:20px 16px 60px}
.panel{display:none;animation:fadeIn .3s}
.panel.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* Section Header */
.sec-head{font-size:11px;color:var(--dim);letter-spacing:2px;text-transform:uppercase;
  padding-bottom:8px;margin-bottom:16px;border-bottom:1px solid var(--border)}

/* Card Grid */
.card-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-bottom:20px}

/* Stage Card */
.stage-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;
  display:flex;flex-direction:column;gap:8px;transition:all .2s;cursor:pointer}
.stage-card:hover{border-color:rgba(240,192,64,.2);box-shadow:0 0 20px rgba(240,192,64,.08)}

.stage-name{font-size:16px;font-weight:900;color:var(--gold)}
.stage-info{display:flex;flex-direction:column;gap:6px}

/* Responsive */
@media(max-width:768px){
  .header h1{font-size:22px}
  .content{padding:20px 12px 60px}
  .card-grid{grid-template-columns:1fr}
}
</style>
</head>
<body data-page="compendium-stage">

<div class="header">
  <h1 data-i18n="compendium.title_stage"></h1>
  <div class="sub" data-i18n="compendium.subtitle_stage"></div>
</div>

<div class="tabs" id="tabs">
  <button class="tab-btn active" data-tab="stages">📋 카드 뷰</button>
  <button class="tab-btn" data-tab="difficulty">📈 난이도 분석</button>
</div>

<div class="content">

  <!-- 스테이지 목록 패널 -->
  <div class="panel active" id="p-stages">
    <div class="sec-head">STAGE LIST</div>
    <div id="stage-cards" class="card-grid"></div>
  </div>

  <!-- 난이도 분석 패널 -->
  <div class="panel" id="p-difficulty">
    <div class="sec-head">DIFFICULTY PROGRESSION</div>
    <div style="background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:20px">
      <div id="difficulty-chart"></div>
    </div>
  </div>

</div><!-- end content -->

<nav id="bottom-nav" style="position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--border);
  display:flex;gap:8px;padding:8px;justify-content:space-around;z-index:100">
  <button onclick="location.href='index.html'" style="flex:1;padding:12px;background:var(--card);border:1px solid var(--border);
    border-radius:8px;color:var(--text);font-weight:700;cursor:pointer;font-size:11px" data-i18n="compendium.nav_lobby"></button>
  <button onclick="location.href='compendium-class.html'" style="flex:1;padding:12px;background:var(--card);border:1px solid var(--border);
    border-radius:8px;color:var(--text);font-weight:700;cursor:pointer;font-size:11px" data-i18n="compendium.nav_class"></button>
  <button onclick="location.href='compendium-item.html'" style="flex:1;padding:12px;background:var(--card);border:1px solid var(--border);
    border-radius:8px;color:var(--text);font-weight:700;cursor:pointer;font-size:11px" data-i18n="compendium.nav_item"></button>
</nav>

<script>
function styleLabel(style) {
  if (style === 'defense') return {icon:'🛡', color:'#60a5fa', bg:'rgba(96,165,250,0.15)'};
  if (style === 'offense') return {icon:'⚔', color:'#f87171', bg:'rgba(248,113,113,0.15)'};
  return {icon:'🔀', color:'#a78bfa', bg:'rgba(167,139,250,0.15)'};
}

function initStage() {
  const stages = window.STAGES || [];
  const cd = window.JAB || {};

  // 스테이지 카드 렌더링
  const container = document.getElementById('stage-cards');
  container.innerHTML = '';

  stages.forEach(stage => {
    const diff = ((stage.sm.hp + stage.sm.atk) / 2 * 100).toFixed(0);
    const enemyCount = {};
    stage.en.forEach(cls => { enemyCount[cls] = (enemyCount[cls] || 0) + 1 });

    const enemyDisplay = Object.entries(enemyCount)
      .sort((a, b) => b[1] - a[1])
      .map(([cls, cnt]) => `${cd[cls]?.icon || '?'} ${t('classes.'+cls) || cls} ×${cnt}`)
      .join(', ');

    const sl = styleLabel(stage.style);
    const stageName = t('stages.stage_'+stage.id+'_name') || stage.name;
    const stageTheme = t('stages.stage_'+stage.id+'_theme') || stage.theme;
    const stageStory = t('stages.stage_'+stage.id+'_story') || stage.story;

    const card = document.createElement('div');
    card.className = 'stage-card';
    card.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div>
          <div class="stage-name">${stageName}</div>
          <div style="font-size:11px;color:var(--dim);margin-top:2px">${stageTheme}</div>
        </div>
        <div style="background:var(--gold);color:var(--bg);padding:2px 8px;border-radius:4px;font-size:11px;font-weight:700">Stage ${stage.id}</div>
      </div>

      <div class="stage-info">
        <div style="display:flex;gap:6px;font-size:10px;flex-wrap:wrap;align-items:center">
          <span style="background:${sl.bg};color:${sl.color};padding:2px 6px;border-radius:3px">
            ${sl.icon} ${stage.style === 'defense' ? t('battle.defense') || '방어전' : stage.style === 'offense' ? t('battle.offense') || '공격전' : t('battle.mixed') || '혼합'}
          </span>
          <span style="color:var(--dim)">${t('stages.enemy_count', {count: stage.en.length}) || stage.en.length+'체'}</span>
          <span style="color:var(--dim)">|</span>
          <span style="color:var(--dim)">${stage.spw} wave · ${stage.si} spawn</span>
        </div>

        <div style="font-size:11px;color:#cbd5e1;margin:4px 0">${stageStory}</div>

        <div style="background:rgba(0,0,0,.3);padding:6px;border-radius:4px;font-size:10px">
          <div style="color:var(--dim);margin-bottom:4px">👹 ${t('stage_select.enemies', {count: stage.en.length}) || '적 구성'}</div>
          <div style="line-height:1.6">${enemyDisplay}</div>
        </div>

        ${stage.boss ? `
        <div style="background:rgba(167,139,250,0.1);border:1px solid rgba(167,139,250,0.3);padding:6px;border-radius:4px;font-size:10px">
          <div style="color:var(--purple);font-weight:700">💀 BOSS: ${stage.boss.name}</div>
          <div style="color:var(--dim);margin-top:2px">${cd[stage.boss.cls]?.icon} ${t('classes.' + stage.boss.cls)}</div>
        </div>
        ` : ''}

        <div style="display:flex;align-items:center;gap:6px;font-size:10px">
          <span style="color:var(--dim)">난이도</span>
          <div style="flex:1;height:8px;background:rgba(255,255,255,.04);border-radius:4px;overflow:hidden">
            <div style="width:${Math.min(100,diff)}%;height:100%;background:linear-gradient(90deg,#4ade80,#fbbf24,#f87171);border-radius:4px"></div>
          </div>
          <span style="color:var(--gold);font-weight:700">${diff}%</span>
        </div>
      </div>
    `;
    container.appendChild(card);
  });

  // 난이도 차트 렌더링
  const diffChart = document.getElementById('difficulty-chart');
  diffChart.innerHTML = '';

  stages.forEach(s => {
    const score = ((s.sm.hp + s.sm.atk) / 2 * 100).toFixed(0);
    const percent = Math.min(100, score);
    const stageName = t('stages.stage_'+s.id+'_name') || s.name;

    const row = document.createElement('div');
    row.style.marginBottom = '12px';
    row.innerHTML = `
      <div style="display:flex;justify-content:space-between;margin-bottom:2px;font-size:12px">
        <span style="color:var(--gold);font-weight:700">Stage ${s.id} — ${stageName}</span>
        <span style="color:var(--dim)">${score}%</span>
      </div>
      <div style="width:100%;height:20px;background:rgba(255,255,255,.04);border-radius:4px;overflow:hidden">
        <div style="width:${percent}%;height:100%;background:linear-gradient(90deg,#4ade80,#fbbf24,#f87171);border-radius:4px;transition:width 0.6s ease"></div>
      </div>
    `;
    diffChart.appendChild(row);
  });
}

// 탭 전환
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('p-' + btn.dataset.tab).classList.add('active');
  };
});

// 초기화
document.addEventListener('DOMContentLoaded', async () => {
  if (typeof loadI18n === 'function') await loadI18n();
  initStage();
});
</script>
</body>
</html>
