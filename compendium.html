<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>📖 도감</title>
<link rel="stylesheet" href="css/common.css">
<script src="data/jab.js"></script>
<script src="js/skills.js"></script>
<script>
var EXP_POTIONS = [
  { id: 'exp_s', name: '소형 경험치 물약', icon: '🧪', exp: 50, cost: 400, weight: 50 },
  { id: 'exp_m', name: '중형 경험치 물약', icon: '⚗️', exp: 150, cost: 1000, weight: 35 },
  { id: 'exp_l', name: '대형 경험치 물약', icon: '🏺', exp: 400, cost: 2400, weight: 15 }
];
</script>
<script defer src="js/common/i18n.js"></script>
<script defer src="js/common/nav.js"></script>
<style>

/* Header */
.header{text-align:center;padding:32px 16px 0;position:relative}
.header h1{font-size:28px;font-weight:900;color:var(--gold);letter-spacing:2px;
  text-shadow:0 0 40px rgba(240,192,64,.25)}
.header .sub{color:var(--dim);font-size:13px;margin-top:4px}

/* Tabs (file-folder style) */
.tabs{display:flex;flex-wrap:wrap;gap:0;justify-content:center;padding:20px 16px 0;
  border-bottom:2px solid var(--gold)}
.tab-btn{padding:8px 16px 10px;border:1px solid var(--border);border-bottom:none;
  border-radius:10px 10px 0 0;background:rgba(255,255,255,.03);
  color:var(--dim);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;
  transition:all .2s;margin-bottom:-2px;position:relative}
.tab-btn:hover{color:var(--text);background:rgba(255,255,255,.07)}
.tab-btn.active{color:#fff;background:var(--card);border-color:var(--gold);
  border-bottom:2px solid var(--card);z-index:1;padding-top:10px}

/* Content */
.content{max-width:900px;margin:0 auto;padding:20px 16px 20px}
.panel{display:none;animation:fadeIn .3s}
.panel.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* Section Header */
.sec-head{font-size:11px;color:var(--dim);letter-spacing:2px;text-transform:uppercase;
  padding-bottom:8px;margin-bottom:16px;border-bottom:1px solid var(--border)}

/* Card Grid */
.card-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-bottom:20px}

/* Class Card */
.class-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;
  display:flex;flex-direction:column;gap:12px;transition:all .2s;cursor:pointer}
.class-card:hover{border-color:rgba(240,192,64,.2);box-shadow:0 0 20px rgba(240,192,64,.08)}

.class-card-header{display:flex;gap:12px;align-items:flex-start}
.class-icon{font-size:48px;line-height:1;flex-shrink:0}
.class-meta{flex:1;min-width:0}
.class-name{font-size:18px;font-weight:900;color:var(--gold);margin:0}
.class-desc{font-size:12px;color:var(--dim);margin-top:4px}

.role-tag{display:inline-block;font-size:10px;padding:2px 6px;border-radius:4px;font-weight:700;margin-top:4px}

/* Stat Box */
.stat-box{background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:8px;padding:8px;
  display:grid;grid-template-columns:repeat(5,1fr);gap:4px;font-size:12px}

.stat-item{text-align:center}
.stat-label{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.stat-value{font-weight:900;color:var(--gold);font-size:16px}

/* Resource Info */
.res-info{background:rgba(0,0,0,.3);border:1px solid var(--border);border-radius:6px;padding:8px;
  display:flex;justify-content:space-between;align-items:center;font-size:11px}

/* Growth Info */
.growth-info{border-top:1px solid var(--border);padding-top:8px}
.growth-row{display:flex;align-items:center;gap:8px;margin-bottom:4px;font-size:11px}

/* Resource System */
.res-block{border-left:3px solid;padding:12px 16px;background:var(--card);border-radius:0 12px 12px 0;margin-bottom:12px}
.res-meter{display:flex;align-items:center;gap:8px;margin:8px 0}
.res-meter-label{width:80px;font-size:12px;font-weight:700;flex-shrink:0;color:var(--text)}
.res-meter-track{flex:1;background:rgba(255,255,255,.04);border-radius:4px;height:16px;overflow:hidden}
.res-meter-fill{height:100%;border-radius:4px;font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:700}
.res-meter-info{font-size:11px;color:var(--dim);width:120px;text-align:right;flex-shrink:0}

/* Table */
table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:20px}
thead th{color:var(--dim);font-size:10px;font-weight:700;padding:8px 4px;text-align:center;
  border-bottom:2px solid var(--border);background:var(--bg);letter-spacing:.5px}
tbody td{padding:8px 4px;text-align:center;border-bottom:1px solid rgba(255,255,255,.04)}
tbody tr:hover{background:rgba(240,192,64,.04)}
th:first-child,td:first-child{text-align:center;width:50px}
th:nth-child(2),td:nth-child(2){text-align:left}

/* Item Card */
.item-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;
  margin-bottom:12px;transition:all .2s}
.item-card:hover{border-color:rgba(240,192,64,.2);box-shadow:0 0 20px rgba(240,192,64,.08)}

.item-header{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.item-icon{font-size:48px;line-height:1;flex-shrink:0}
.item-meta{flex:1}
.item-name{font-size:16px;font-weight:900;color:var(--gold)}
.item-info{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px;
  background:rgba(0,0,0,.2);padding:12px;border-radius:8px}
.info-box{text-align:center}
.info-label{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
.info-value{font-weight:900;color:var(--gold);font-size:16px;margin-top:4px}

/* Scroll Card */
.scroll-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;
  display:flex;flex-direction:column;gap:10px;transition:all .2s}
.scroll-card:hover{border-color:rgba(167,139,250,.3);box-shadow:0 0 20px rgba(167,139,250,.08)}

/* Stage Card */
.stage-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;
  display:flex;flex-direction:column;gap:8px;transition:all .2s;cursor:pointer}
.stage-card:hover{border-color:rgba(240,192,64,.2);box-shadow:0 0 20px rgba(240,192,64,.08)}

.stage-name{font-size:16px;font-weight:900;color:var(--gold)}
.stage-info{display:flex;flex-direction:column;gap:6px}

/* Responsive */
@media(max-width:768px){
  .header h1{font-size:22px}
  .content{padding:20px 12px 20px}
  .card-grid{grid-template-columns:1fr}
  table{font-size:11px}
  thead th{font-size:9px;padding:6px 2px}
  tbody td{padding:6px 2px}
  .item-info{grid-template-columns:1fr}
}
</style>
</head>
<body data-page="compendium">

<header id="top-nav">
  <button id="nav-back" onclick="history.back()"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button>
  <div id="nav-title"></div>
  <button id="nav-settings" onclick="location.href='settings.html'"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
</header>

<main>
  <div class="header">
    <h1>📖 도감</h1>
    <div class="sub">게임의 모든 정보를 한곳에서 확인하세요</div>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab-btn active" data-tab="characters">🛡️ 캐릭터</button>
    <button class="tab-btn" data-tab="items">🧪 아이템</button>
    <button class="tab-btn" data-tab="stages">🗺️ 스테이지</button>
  </div>

  <div class="content">

    <!-- 캐릭터 탭 -->
    <div class="panel active" id="p-characters">
      <div class="sec-head">CLASSES OVERVIEW</div>
      <div id="class-cards" class="card-grid"></div>

      <div style="margin-top:40px"></div>
      <div class="sec-head">RESOURCE SYSTEM</div>
      <div id="res-blocks"></div>
    </div>

    <!-- 아이템 탭 -->
    <div class="panel" id="p-items">
      <div class="sec-head">EXPERIENCE POTIONS</div>
      <div style="overflow-x:auto">
      <table>
        <thead>
          <tr>
            <th></th>
            <th style="text-align:left">이름</th>
            <th>EXP</th>
            <th>가격</th>
            <th>효율</th>
            <th>확률</th>
          </tr>
        </thead>
        <tbody id="item-table-body"></tbody>
      </table>
      </div>

      <div style="margin-top:40px"></div>
      <div class="sec-head">CLASS CHANGE SCROLLS</div>
      <div id="scroll-cards" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px"></div>

      <div style="margin-top:40px"></div>
      <div class="sec-head">EFFICIENCY RANKING</div>
      <div id="efficiency-cards"></div>
    </div>

    <!-- 스테이지 탭 -->
    <div class="panel" id="p-stages">
      <div class="sec-head">STAGE LIST</div>
      <div id="stage-cards" class="card-grid"></div>

      <div style="margin-top:40px"></div>
      <div class="sec-head">DIFFICULTY PROGRESSION</div>
      <div style="background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:20px">
        <div id="difficulty-chart"></div>
      </div>
    </div>

  </div><!-- end content -->
</main>

<script>
const PLAYER_CLASSES = ['warrior','knight','assassin','mage','archer','priest','novice','summoner','shaman','brawler','lancer','sapper'];

function getRole(cls) {
  if (cls === 'priest') return 'healer';
  return (JAB[cls]?.base.range || 1) > 1 ? 'ranged' : 'melee';
}

function roleStyle(role) {
  const m = { melee:'background:rgba(248,113,113,.15);color:#f87171', ranged:'background:rgba(96,165,250,.15);color:#60a5fa', healer:'background:rgba(74,222,128,.15);color:#4ade80' };
  return m[role] || '';
}

function resColor(res) {
  return res === 'fury' ? 'var(--fury)' : res === 'energy' ? 'var(--energy)' : res === 'mana' ? 'var(--mana)' : 'var(--dim)';
}

// 클래스 카드 렌더링
function renderClassCards() {
  const container = document.getElementById('class-cards');
  container.innerHTML = '';

  PLAYER_CLASSES.forEach(cls => {
    const d = JAB[cls]; if (!d) return;
    const b = d.base;
    const role = getRole(cls);

    // 기본 스킬 가져오기
    const baseSkill = SKILLS[cls];
    const baseSkills = baseSkill ? (Array.isArray(baseSkill) ? baseSkill : [baseSkill]) : [];

    // 습득형 스킬 가져오기
    const learnableSkills = Object.values(LEARNABLE_SKILLS).filter(sk => sk.cls === cls && !sk.passive);
    const passiveSkills = Object.values(LEARNABLE_SKILLS).filter(sk => sk.cls === cls && sk.passive);

    // 기본 스킬 HTML
    let skillHtml = baseSkills.map(sk =>
      `<div style="display:flex;gap:6px;align-items:center;font-size:10px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.04)">
        ${skillIcon(sk.id, 16)}
        <span style="color:var(--gold);font-weight:700;min-width:60px">${sk.name}</span>
        <span style="color:var(--dim);flex:1;font-size:9px">${sk.desc}</span>
        <span style="color:${resColor(sk.costType)};font-weight:700;font-size:9px;white-space:nowrap">${sk.cost} ${sk.costType}</span>
      </div>`
    ).join('');

    // 습득형 스킬 HTML
    let learnableHtml = '';
    if (learnableSkills.length) {
      learnableHtml = `<div style="margin-top:4px;padding-top:4px;border-top:1px solid var(--border)">
        <div style="font-size:9px;color:var(--dim);font-weight:700;margin-bottom:4px;letter-spacing:.5px">📚 습득형 스킬</div>
        ${learnableSkills.map(sk =>
          `<div style="display:flex;gap:6px;align-items:center;font-size:10px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.04)">
            ${skillIcon(sk.id, 16)}
            <span style="color:var(--gold);font-weight:700;min-width:60px">${sk.name}</span>
            <span style="color:var(--dim);flex:1;font-size:9px">${sk.desc}</span>
            <span style="color:${resColor(sk.costType)};font-weight:700;font-size:9px;white-space:nowrap">${sk.cost || '—'} ${sk.costType || '—'}</span>
          </div>`
        ).join('')}
      </div>`;
    }

    // 패시브 스킬 HTML
    let passiveHtml = '';
    if (passiveSkills.length) {
      passiveHtml = `<div style="margin-top:4px;padding-top:4px;border-top:1px solid var(--border)">
        <div style="font-size:9px;color:var(--purple);font-weight:700;margin-bottom:4px;letter-spacing:.5px">⭐ 패시브</div>
        ${passiveSkills.map(sk =>
          `<div style="display:flex;gap:6px;align-items:center;font-size:10px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.04)">
            ${skillIcon(sk.id, 16)}
            <span style="color:var(--purple);font-weight:700;min-width:60px">${sk.name}</span>
            <span style="color:var(--dim);flex:1;font-size:9px">${sk.desc}</span>
          </div>`
        ).join('')}
      </div>`;
    }

    // 특수 패시브 (암살자 은신 등)
    let specialPassiveHtml = '';
    if (cls === 'assassin') {
      specialPassiveHtml = `<div style="margin-top:4px;padding-top:4px;border-top:1px solid var(--border)">
        <div style="display:flex;gap:6px;align-items:center;font-size:10px;padding:4px 0">
          <span>🌿</span>
          <span style="color:var(--purple);font-weight:700">은신 (고정)</span>
          <span style="color:var(--dim);font-size:9px">숲 지형에서 적에게 보이지 않음</span>
        </div>
      </div>`;
    }

    const card = document.createElement('div');
    card.className = 'class-card';
    card.innerHTML = `
      <div class="class-card-header">
        <div class="class-icon"><img src="image/icon/jab/${cls}.png" alt="${cls}" style="width:100%;height:100%;image-rendering:pixelated;border-radius:4px"></div>
        <div class="class-meta">
          <div class="class-name">${cls}</div>
          <span class="role-tag" style="${roleStyle(role)}">${role}</span>
        </div>
      </div>

      <div class="stat-box">
        <div class="stat-item"><div class="stat-label">HP</div><div class="stat-value">${b.hp}</div></div>
        <div class="stat-item"><div class="stat-label">ATK</div><div class="stat-value">${b.atk}</div></div>
        <div class="stat-item"><div class="stat-label">DEF</div><div class="stat-value">${b.def}</div></div>
        <div class="stat-item"><div class="stat-label">MOV</div><div class="stat-value">${b.move}</div></div>
        <div class="stat-item"><div class="stat-label">RNG</div><div class="stat-value">${b.range}</div></div>
      </div>

      <div class="res-info">
        <span style="color:${resColor(d.res)};font-weight:700">${d.res.toUpperCase()} ${d.maxRes}</span>
        <span style="color:var(--dim);font-size:10px">${d.resRec > 0 ? '턴당 +'+d.resRec : d.res === 'fury' ? '전투 시 충전' : d.resRec === 0 ? '매턴 회복' : ''}</span>
      </div>

      <div style="background:rgba(0,0,0,.2);border:1px solid var(--border);border-radius:6px;padding:8px;font-size:10px">
        <div style="font-size:9px;color:var(--dim);font-weight:700;margin-bottom:4px;letter-spacing:.5px">🎯 스킬</div>
        ${skillHtml || '<div style="color:var(--dim)">없음</div>'}
        ${learnableHtml}
        ${passiveHtml}
        ${specialPassiveHtml}
      </div>

      <div class="growth-info">
        <div style="font-size:10px;font-weight:700;color:var(--gold);margin-bottom:6px;letter-spacing:.5px">성장률</div>
        <div class="growth-row">
          <span style="color:var(--dim);width:32px">HP</span>
          <div style="flex:1;height:6px;background:rgba(255,255,255,.04);border-radius:3px;overflow:hidden">
            <div style="width:${(d.growth.hp[1]/18*100).toFixed(0)}%;height:100%;background:var(--green);border-radius:3px"></div>
          </div>
          <span style="color:var(--dim);width:48px;text-align:right;font-size:9px">+${d.growth.hp[0]}~${d.growth.hp[1]}</span>
        </div>
        <div class="growth-row">
          <span style="color:var(--dim);width:32px">ATK</span>
          <div style="flex:1;height:6px;background:rgba(255,255,255,.04);border-radius:3px;overflow:hidden">
            <div style="width:${(d.growth.atk[1]/5*100).toFixed(0)}%;height:100%;background:var(--red);border-radius:3px"></div>
          </div>
          <span style="color:var(--dim);width:48px;text-align:right;font-size:9px">+${d.growth.atk[0]}~${d.growth.atk[1]}</span>
        </div>
        <div class="growth-row">
          <span style="color:var(--dim);width:32px">DEF</span>
          <div style="flex:1;height:6px;background:rgba(255,255,255,.04);border-radius:3px;overflow:hidden">
            <div style="width:${(d.growth.def[1]/4*100).toFixed(0)}%;height:100%;background:var(--blue);border-radius:3px"></div>
          </div>
          <span style="color:var(--dim);width:48px;text-align:right;font-size:9px">+${d.growth.def[0]}~${d.growth.def[1]}</span>
        </div>
      </div>
    `;
    container.appendChild(card);
  });
}

// 자원 시스템 렌더링
function renderResBlocks() {
  const container = document.getElementById('res-blocks');
  container.innerHTML = '';

  const groups = [
    { res:'fury', color:'var(--fury)', label:'분노 (Fury)', desc:'공격 시 +1, 피격 시 +2 충전. MAX 도달 시 패시브 자동 발동 후 0으로 리셋.',
      classes: PLAYER_CLASSES.filter(c => JAB[c]?.res === 'fury') },
    { res:'energy', color:'var(--energy)', label:'에너지 (Energy)', desc:'매 턴 자동 회복. 액티브 스킬 사용 시 소모.',
      classes: PLAYER_CLASSES.filter(c => JAB[c]?.res === 'energy') },
    { res:'mana', color:'var(--mana)', label:'마나 (Mana)', desc:'매 턴 자동 회복. 마법/힐 스킬 사용 시 소모. 전투 시작 시 MAX.',
      classes: PLAYER_CLASSES.filter(c => JAB[c]?.res === 'mana') }
  ];

  groups.forEach(g => {
    const block = document.createElement('div');
    block.className = 'res-block';
    block.style.borderColor = g.color;

    let metersHtml = g.classes.map(cls => {
      const d = JAB[cls];
      const pct = 100;
      return `<div class="res-meter">
        <div class="res-meter-label"><img src="image/icon/jab/${cls}.png" alt="${cls}" style="width:16px;height:16px;vertical-align:middle;image-rendering:pixelated;border-radius:2px"> ${t('classes.'+cls) || cls}</div>
        <div class="res-meter-track">
          <div class="res-meter-fill" style="width:${pct}%;background:${g.color};color:var(--bg)">${d.maxRes}</div>
        </div>
        <div class="res-meter-info">${d.resRec > 0 ? '턴당 +'+d.resRec : 'MAX '+d.maxRes}</div>
      </div>`;
    }).join('');

    block.innerHTML = `
      <div style="font-weight:900;font-size:15px;margin-bottom:4px;color:${g.color}">${g.label}</div>
      <div style="font-size:12px;color:var(--dim);margin-bottom:8px">${g.desc}</div>
      ${metersHtml}
    `;
    container.appendChild(block);
  });
}

// 경험치 물약 테이블
function renderItemTable() {
  const potions = window.EXP_POTIONS || [];
  const totalWeight = potions.reduce((sum, p) => sum + p.weight, 0);
  const tbody = document.getElementById('item-table-body');
  tbody.innerHTML = '';

  potions.forEach(p => {
    const efficiency = (p.exp / p.cost).toFixed(2);
    const probability = ((p.weight / totalWeight) * 100).toFixed(0);
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td style="font-size:24px">${p.icon}</td>
      <td style="text-align:left;font-weight:700;color:var(--gold)">${t('items.potion_'+{s:'small',m:'medium',l:'large'}[p.id.split('_')[1]]) || p.name}</td>
      <td style="color:var(--green);font-weight:700">+${p.exp}</td>
      <td style="color:var(--blue);font-weight:700">${p.cost}G</td>
      <td style="font-weight:700;color:var(--gold)">${efficiency}</td>
      <td style="color:var(--dim)">${probability}%</td>
    `;
    tbody.appendChild(tr);
  });
}

// 전직서 카드 렌더링
function renderScrollCards() {
  const cd = window.JAB || {};
  const container = document.getElementById('scroll-cards');
  container.innerHTML = '';

  const scrolls = [
    { id:'class_change_melee', icon:'⚔️', cost:500, classes:['warrior','knight','assassin','brawler','lancer','sapper'] },
    { id:'class_change_ranged', icon:'🏹', cost:500, classes:['archer','mage','summoner','shaman'] },
    { id:'class_change_healer', icon:'✝️', cost:500, classes:['priest'] },
    { id:'class_change_universal', icon:'📜', cost:500, classes:['warrior','knight','assassin','mage','archer','priest','summoner','shaman','brawler','lancer','sapper'] }
  ];

  scrolls.forEach(sc => {
    const name = t('items.'+sc.id) || sc.id;
    const desc = t('items_desc.'+sc.id) || '';
    const classIcons = sc.classes.map(cls =>
      `<span style="display:inline-flex;align-items:center;gap:2px;background:rgba(255,255,255,.04);padding:2px 6px;border-radius:4px;font-size:10px">
        ${cd[cls]?.icon || ''} ${t('classes.'+cls) || cls}
      </span>`
    ).join(' ');

    const card = document.createElement('div');
    card.className = 'scroll-card';
    card.innerHTML = `
      <div style="display:flex;gap:12px;align-items:flex-start">
        <div style="font-size:40px;line-height:1">${sc.icon}</div>
        <div style="flex:1">
          <div style="font-size:16px;font-weight:900;color:var(--purple)">${name}</div>
          <div style="font-size:11px;color:var(--dim);margin-top:2px">${desc}</div>
          <div style="display:flex;align-items:center;gap:6px;margin-top:6px">
            <span style="color:var(--gold);font-weight:700;font-size:13px">${sc.cost}G</span>
            <span style="color:var(--dim);font-size:10px">| 노비스 전용</span>
          </div>
        </div>
      </div>
      <div style="background:rgba(0,0,0,.2);padding:8px;border-radius:6px">
        <div style="color:var(--dim);font-size:10px;margin-bottom:6px">전직 가능 직업 (${sc.classes.length})</div>
        <div style="display:flex;flex-wrap:wrap;gap:4px">${classIcons}</div>
      </div>
    `;
    container.appendChild(card);
  });
}

// 효율 분석 렌더링
function renderEfficiencyAnalysis() {
  const potions = window.EXP_POTIONS || [];
  const totalWeight = potions.reduce((sum, p) => sum + p.weight, 0);
  const container = document.getElementById('efficiency-cards');

  const sorted = [...potions]
    .map(p => ({
      ...p,
      efficiency: p.exp / p.cost,
      probability: ((p.weight / totalWeight) * 100).toFixed(0)
    }))
    .sort((a, b) => b.efficiency - a.efficiency);

  container.innerHTML = '';
  sorted.forEach((item, idx) => {
    const grades = ['S', 'A', 'B'];
    const gradeColors = ['#f87171', '#f0c040', '#60a5fa'];
    const card = document.createElement('div');
    card.className = 'item-card';
    card.innerHTML = `
      <div class="item-header">
        <div class="item-icon">${item.icon}</div>
        <div class="item-meta">
          <div class="item-name">
            ${t('items.potion_'+{s:'small',m:'medium',l:'large'}[item.id.split('_')[1]]) || item.name}
            <span style="margin-left:8px;background:${gradeColors[idx] || 'var(--dim)'};color:var(--bg);padding:2px 8px;border-radius:4px;
              font-size:11px;font-weight:700">${grades[idx] || 'C'}</span>
          </div>
          <div style="font-size:11px;color:var(--dim);margin-top:4px">#${idx + 1} 효율 순위</div>
        </div>
      </div>

      <div class="item-info">
        <div class="info-box">
          <div class="info-label">EXP</div>
          <div class="info-value" style="color:var(--green)">+${item.exp}</div>
        </div>
        <div class="info-box">
          <div class="info-label">COST</div>
          <div class="info-value" style="color:var(--blue)">${item.cost}G</div>
        </div>
        <div class="info-box">
          <div class="info-label">EXP/G</div>
          <div class="info-value" style="color:var(--gold)">${item.efficiency.toFixed(2)}</div>
        </div>
      </div>

      <div style="margin-top:12px;padding:8px;background:rgba(0,0,0,.2);border-radius:6px;font-size:11px">
        <div style="color:var(--dim);margin-bottom:2px">상점 등장 확률</div>
        <div style="display:flex;align-items:center;gap:8px">
          <div style="flex:1;height:8px;background:rgba(255,255,255,.04);border-radius:4px;overflow:hidden">
            <div style="width:${item.probability}%;height:100%;background:var(--gold);border-radius:4px"></div>
          </div>
          <span style="color:var(--text);font-weight:700">${item.probability}%</span>
        </div>
      </div>
    `;
    container.appendChild(card);
  });
}

// 스테이지 카드 렌더링
function renderStageCards() {
  const stages = window.STAGES || [];
  const cd = window.JAB || {};
  const container = document.getElementById('stage-cards');
  container.innerHTML = '';

  function styleLabel(style) {
    if (style === 'defense') return {icon:'🛡', color:'#60a5fa', bg:'rgba(96,165,250,0.15)'};
    if (style === 'offense') return {icon:'⚔', color:'#f87171', bg:'rgba(248,113,113,0.15)'};
    return {icon:'🔀', color:'#a78bfa', bg:'rgba(167,139,250,0.15)'};
  }

  stages.forEach(stage => {
    const diff = ((stage.sm.hp + stage.sm.atk) / 2 * 100).toFixed(0);
    const enemyCount = {};
    stage.en.forEach(cls => { enemyCount[cls] = (enemyCount[cls] || 0) + 1 });

    const enemyDisplay = Object.entries(enemyCount)
      .sort((a, b) => b[1] - a[1])
      .map(([cls, cnt]) => `${cd[cls]?.icon || '?'} ${t('classes.'+cls) || cls} ×${cnt}`)
      .join(', ');

    const sl = styleLabel(stage.style);
    const stageName = t('stage.'+stage.id+'.name') || stage.name;
    const stageStory = t('stage.'+stage.id+'.story') || stage.story;

    const card = document.createElement('div');
    card.className = 'stage-card';
    card.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div>
          <div class="stage-name">${stageName}</div>
          <div style="font-size:11px;color:var(--dim);margin-top:2px">${stage.theme}</div>
        </div>
        <div style="background:var(--gold);color:var(--bg);padding:2px 8px;border-radius:4px;font-size:11px;font-weight:700">Stage ${stage.id}</div>
      </div>

      <div class="stage-info">
        <div style="display:flex;gap:6px;font-size:10px;flex-wrap:wrap;align-items:center">
          <span style="background:${sl.bg};color:${sl.color};padding:2px 6px;border-radius:3px">
            ${sl.icon} ${stage.style === 'defense' ? '방어전' : stage.style === 'offense' ? '공격전' : '혼합'}
          </span>
          <span style="color:var(--dim)">${stage.en.length}체</span>
          <span style="color:var(--dim)">|</span>
          <span style="color:var(--dim)">${stage.spw} wave · ${stage.si} spawn</span>
        </div>

        <div style="font-size:11px;color:#cbd5e1;margin:4px 0">${stageStory}</div>

        <div style="background:rgba(0,0,0,.3);padding:6px;border-radius:4px;font-size:10px">
          <div style="color:var(--dim);margin-bottom:4px">👹 적 구성</div>
          <div style="line-height:1.6">${enemyDisplay}</div>
        </div>

        ${stage.boss ? `
        <div style="background:rgba(167,139,250,0.1);border:1px solid rgba(167,139,250,0.3);padding:6px;border-radius:4px;font-size:10px">
          <div style="color:var(--purple);font-weight:700">💀 BOSS: ${stage.boss.name}</div>
          <div style="color:var(--dim);margin-top:2px">${cd[stage.boss.cls]?.icon} ${t('classes.' + stage.boss.cls) || stage.boss.cls}</div>
        </div>
        ` : ''}

        <div style="display:flex;align-items:center;gap:6px;font-size:10px">
          <span style="color:var(--dim)">난이도</span>
          <div style="flex:1;height:8px;background:rgba(255,255,255,.04);border-radius:4px;overflow:hidden">
            <div style="width:${Math.min(100,diff)}%;height:100%;background:linear-gradient(90deg,#4ade80,#fbbf24,#f87171);border-radius:4px"></div>
          </div>
          <span style="color:var(--gold);font-weight:700">${diff}%</span>
        </div>
      </div>
    `;
    container.appendChild(card);
  });
}

// 난이도 차트 렌더링
function renderDifficultyChart() {
  const stages = window.STAGES || [];
  const diffChart = document.getElementById('difficulty-chart');
  diffChart.innerHTML = '';

  stages.forEach(s => {
    const score = ((s.sm.hp + s.sm.atk) / 2 * 100).toFixed(0);
    const percent = Math.min(100, score);
    const stageName = t('stage.'+s.id+'.name') || s.name;

    const row = document.createElement('div');
    row.style.marginBottom = '12px';
    row.innerHTML = `
      <div style="display:flex;justify-content:space-between;margin-bottom:2px;font-size:12px">
        <span style="color:var(--gold);font-weight:700">Stage ${s.id} — ${stageName}</span>
        <span style="color:var(--dim)">${score}%</span>
      </div>
      <div style="width:100%;height:20px;background:rgba(255,255,255,.04);border-radius:4px;overflow:hidden">
        <div style="width:${percent}%;height:100%;background:linear-gradient(90deg,#4ade80,#fbbf24,#f87171);border-radius:4px;transition:width 0.6s ease"></div>
      </div>
    `;
    diffChart.appendChild(row);
  });
}

// 탭 전환
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('p-' + btn.dataset.tab).classList.add('active');
  };
});

// 초기화
document.addEventListener('DOMContentLoaded', async () => {
  if (typeof loadI18n === 'function') await loadI18n();
  renderClassCards();
  renderResBlocks();
  renderItemTable();
  renderScrollCards();
  renderEfficiencyAnalysis();
  renderStageCards();
  renderDifficultyChart();
});
</script>
</body>
</html>
