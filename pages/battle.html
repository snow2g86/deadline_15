<div id="battle-screen" class="full-screen hidden">
<div id="app">
  <div id="top-bar">
    <div class="tb-left">
      <div id="turn-indicator" class="player">PLAYER</div>
      <button class="cam-btn" onclick="G.rotCam(-1)" title="카메라 좌회전 (Q)">↶</button>
      <button class="cam-btn" onclick="G.rotCam(1)" title="카메라 우회전 (E)">↷</button>
    </div>
    <div id="stage-info">STAGE 1<div class="si-turn">TURN 1</div></div>
    <div class="tb-right"><button id="btn-end-turn" onclick="G.endTurn()">턴 종료</button></div>
  </div>
  <div id="map-container">
    <div id="iso-world">
      <canvas id="vfx-canvas"></canvas>
      <div id="action-menu" onclick="event.stopPropagation()">
        <button id="btn-wait" onclick="G.actWait()">⏸ 대기</button>
        <button id="btn-cancel" onclick="G.actCancel()">↩ 취소</button>
      </div>
    </div>
  </div>
  <div id="info-panel"><div style="color:var(--dim);font-size:11px">유닛을 선택하세요</div></div>
</div>
<div id="turn-flash"></div>
<div id="cam-dir"><div class="cd-arrow">▲</div><div class="cd-label">N</div></div>
<div id="ally-nav"></div>
<div id="minimap"><canvas id="mm-cv"></canvas><div class="mm-vp" id="mm-vp"></div></div>
<button id="settings-btn" onclick="G.toggleSettings()" title="설정">⚙</button>
<div id="settings-backdrop" onclick="G.closeSettings()"></div>
<div id="settings-panel">
  <div class="sp-title">⚙ 설정</div>
  <div class="sp-toggle"><span class="sp-tlabel">🎵 배경음악</span><label class="sp-switch"><input type="checkbox" id="sp-bgm-on" checked onchange="G.setBGMOn(this.checked)"><span class="slider"></span></label></div>
  <div class="sp-row"><span class="sp-label">    볼륨</span><input type="range" id="sp-bgm" min="0" max="100" value="60" oninput="G.setBGMVol(this.value)"><span class="sp-val" id="sp-bgm-val">60</span></div>
  <div class="sp-toggle"><span class="sp-tlabel">🔊 효과음</span><label class="sp-switch"><input type="checkbox" id="sp-sfx-on" checked onchange="G.setSFXOn(this.checked)"><span class="slider"></span></label></div>
  <div class="sp-row"><span class="sp-label">    볼륨</span><input type="range" id="sp-sfx" min="0" max="100" value="80" oninput="G.setSFXVol(this.value)"><span class="sp-val" id="sp-sfx-val">80</span></div>
  <div class="sp-divider"></div>
  <div class="sp-row"><span class="sp-label">⏩ 게임 속도</span><input type="range" id="sp-speed" min="50" max="200" value="100" step="25" oninput="G.setSpeed(this.value)"><span class="sp-val" id="sp-speed-val">1.0x</span></div>
  <div class="sp-divider"></div>
  <div class="sp-btn-row">
    <button class="sp-btn" onclick="G.closeSettings()">닫기</button>
    <button class="sp-btn danger" onclick="G.surrender()">🏳 항복</button>
  </div>
</div>
<div id="turn-confirm"><div id="tc-box">
  <div class="tc-msg">모든 아군이 행동을 완료했습니다.<br>턴을 종료하시겠습니까?</div>
  <div class="tc-btns"><button class="tc-yes" onclick="G.confirmEndTurn(true)">턴 종료</button><button class="tc-no" onclick="G.confirmEndTurn(false)">취소</button></div>
  <label class="tc-skip"><input type="checkbox" id="tc-skip-chk" onchange="G.setAutoEnd(this.checked)">다음에 묻지 않기</label>
</div></div>
<div id="enemy-banner">⚔ ENEMY TURN ⚔</div><div id="wave-banner"></div>
</div>
